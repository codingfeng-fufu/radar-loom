<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>技术雷达 · 交互图谱</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20242a;
      --muted: #68717d;
      --line: #d8dde3;
      --paper: #fff;
      --panel: #f5f7f8;
      --canvas: #111820;
      --accent: #0b6b57;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { color: var(--ink); background: var(--paper); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-rows: 56px minmax(0, 1fr); height: 100dvh; }
    .toolbar {
      position: relative; z-index: 40; display: grid; grid-template-columns: auto auto minmax(180px, 440px) auto;
      align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--paper);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand a { color: var(--ink); text-decoration: none; }
    .brand strong { white-space: nowrap; font-size: 16px; }
    .statline { color: var(--muted); white-space: nowrap; font-size: 12px; }
    .search-wrap { position: relative; min-width: 0; }
    .search { width: 100%; height: 36px; border: 1px solid #bfc7cf; border-radius: 4px; padding: 0 34px 0 11px; color: var(--ink); background: var(--paper); outline: 0; }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgb(11 107 87 / 14%); }
    .search-results { position: absolute; z-index: 60; top: 40px; left: 0; right: 0; max-height: 300px; overflow: auto; border: 1px solid var(--line); background: var(--paper); box-shadow: 0 10px 28px rgb(0 0 0 / 14%); }
    .search-results[hidden] { display: none; }
    .search-result { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: var(--paper); padding: 8px 10px; text-align: left; }
    .search-result:hover, .search-result:focus { background: #eaf4f1; }
    .search-result small { display: block; color: var(--muted); }
    .tools { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .mode-switch { display: grid; grid-template-columns: repeat(3, auto); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .mode-button { height: 32px; border: 0; border-right: 1px solid var(--line); padding: 0 10px; background: var(--paper); color: var(--muted); white-space: nowrap; }
    .mode-button:last-child { border-right: 0; }
    .mode-button[aria-pressed="true"] { background: #dcefe9; color: #075545; font-weight: 700; }
    .tool-button { min-width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); padding: 0 9px; }
    .tool-button:hover { border-color: #9ca7b2; background: var(--panel); }
    .icon-button { width: 36px; padding: 0; display: inline-grid; place-items: center; }
    .icon-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .mobile-filter { display: none; }
    .workspace { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; min-height: 0; }
    .filters, .details { min-height: 0; overflow: auto; background: var(--paper); }
    .filters { border-right: 1px solid var(--line); padding: 16px; }
    .details { border-left: 1px solid var(--line); padding: 18px; }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 14px; font-size: 14px; }
    .panel-close { display: none; width: 30px; height: 30px; border: 0; background: transparent; font-size: 20px; }
    .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; margin-bottom: 18px; background: var(--line); border: 1px solid var(--line); }
    .metric { background: var(--paper); padding: 9px; }
    .metric strong { display: block; font-size: 18px; line-height: 1.2; }
    .metric span { color: var(--muted); font-size: 11px; }
    .filter-section { border-top: 1px solid var(--line); padding: 14px 0; }
    .filter-section h3 { margin: 0 0 9px; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .check-list { display: grid; gap: 7px; }
    .taxonomy-reference { margin-left: calc(var(--depth, 0) * 12px); }
    .check-row { display: grid; grid-template-columns: 16px 12px minmax(0, 1fr) auto; align-items: center; gap: 7px; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; }
    .count { color: var(--muted); font-size: 11px; }
    .switch-row { display: flex; align-items: flex-start; gap: 8px; color: var(--ink); }
    .graph-shell { position: relative; min-width: 0; min-height: 0; background: var(--canvas); }
    .graph { position: absolute; inset: 0; aspect-ratio: 16 / 9; }
    .graph-legend { position: absolute; z-index: 12; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; max-width: calc(100% - 24px); padding: 7px 9px; border: 1px solid rgb(255 255 255 / 14%); border-radius: 4px; background: rgb(17 24 32 / 78%); color: #d9e1e8; font-size: 11px; pointer-events: none; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-line { width: 18px; border-top: 2px solid #8da0ae; }
    .legend-line.related { border-top-style: dashed; border-color: #d7a85a; }
    .legend-line.membership { border-color: #6dc5ad; }
    .legend-line.seed-source { border-color: #b97832; }
    .legend-line.automatic-source { border-color: #6176a8; border-top-style: double; }
    .legend-line.candidate-source { border-color: #6dc5ad; border-top-style: dashed; }
    .toast { position: absolute; z-index: 30; top: 12px; left: 50%; transform: translateX(-50%); max-width: min(520px, calc(100% - 24px)); border-radius: 4px; padding: 9px 12px; background: #f7fafc; color: var(--ink); box-shadow: 0 8px 28px rgb(0 0 0 / 28%); }
    .toast[hidden] { display: none; }
    .overlay { position: absolute; z-index: 20; inset: 0; display: flex; align-items: center; justify-content: center; background: rgb(17 24 32 / 88%); color: #e8edf2; text-align: center; padding: 24px; }
    .overlay[hidden] { display: none; }
    .overlay-box { max-width: 420px; }
    .overlay h2 { margin: 0 0 8px; font-size: 18px; }
    .overlay p { margin: 0 0 12px; color: #b9c2cb; }
    .overlay a { color: #75d5bc; }
    .spinner { width: 30px; height: 30px; margin: 0 auto 12px; border: 3px solid #56616d; border-top-color: #75d5bc; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .detail-empty { color: var(--muted); }
    .node-title { margin: 0; font-size: 19px; line-height: 1.3; overflow-wrap: anywhere; }
    .node-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
    .badge { border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; color: var(--muted); font-size: 11px; }
    .summary { margin: 0 0 16px; color: #3f4750; }
    .detail-grid { display: grid; grid-template-columns: 1fr auto; gap: 7px; margin-bottom: 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 10px 0; }
    .detail-grid span:nth-child(even) { font-weight: 700; }
    .open-link { display: block; width: 100%; border: 0; border-radius: 4px; background: var(--accent); color: white; padding: 9px 12px; text-align: center; text-decoration: none; font-weight: 700; }
    .neighbors { margin-top: 18px; }
    .neighbors h3 { margin: 0 0 8px; font-size: 12px; }
    .neighbor-list { display: grid; gap: 5px; }
    .neighbor-button { border: 0; border-left: 2px solid var(--line); background: transparent; padding: 4px 7px; text-align: left; color: var(--ink); overflow-wrap: anywhere; }
    .neighbor-button:hover { border-color: var(--accent); color: var(--accent); }
    .mobile-scrim { display: none; }
    @media (max-width: 1000px) {
      .workspace { grid-template-columns: 220px minmax(0, 1fr); }
      .details { position: absolute; z-index: 35; right: 12px; top: 68px; bottom: 12px; width: min(320px, calc(100vw - 24px)); box-shadow: 0 12px 36px rgb(0 0 0 / 24%); transform: translateX(calc(100% + 28px)); transition: transform 160ms ease; }
      body.details-open .details { transform: translateX(0); }
      .details .panel-close { display: block; }
    }
    @media (max-width: 760px) {
      .app { grid-template-rows: 144px minmax(0, 1fr); }
      .toolbar { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: 44px 44px 48px; gap: 0 8px; padding: 4px 10px; }
      .brand .statline { display: none; }
      .mode-switch { grid-column: 1 / -1; grid-row: 2; width: 100%; }
      .mode-button { width: 100%; padding: 0 4px; }
      .search-wrap { grid-column: 1 / -1; grid-row: 3; }
      .tools .text-button, .tools label { display: none; }
      .mobile-filter { display: inline-block; }
      .workspace { display: block; position: relative; }
      .graph-shell { position: absolute; inset: 0; }
      .graph { aspect-ratio: auto; }
      .filters { position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); transform: translateX(-102%); transition: transform 160ms ease; box-shadow: 8px 0 28px rgb(0 0 0 / 24%); }
      body.filters-open .filters { transform: translateX(0); }
      .filters .panel-close { display: block; }
      .details { position: fixed; z-index: 50; top: auto; right: 0; bottom: 0; left: 0; width: auto; max-height: 58vh; transform: translateY(105%); transition: transform 160ms ease; border-top: 1px solid var(--line); box-shadow: 0 -8px 28px rgb(0 0 0 / 24%); }
      body.details-open .details { transform: translateY(0); }
      body.filters-open .mobile-scrim, body.details-open .mobile-scrim { display: block; position: fixed; z-index: 45; inset: 0; border: 0; background: rgb(0 0 0 / 38%); }
    }
  </style>
  <script src="vendor/cytoscape/cytoscape.min.js"></script>
  <script src="vendor/cytoscape/layout-base.js"></script>
  <script src="vendor/cytoscape/cose-base.js"></script>
  <script src="vendor/cytoscape/cytoscape-fcose.js"></script>
</head>
<body>
  <div class="app">
    <header class="toolbar" id="toolbar">
      <div class="brand"><a href="viewer.html" title="返回知识库">←</a><strong>交互图谱</strong><span class="statline" id="toolbarStats">载入中</span></div>
      <div class="mode-switch" id="modeSwitch" role="group" aria-label="图谱视图">
        <button class="mode-button" type="button" data-mode="knowledge" aria-pressed="true">知识关系</button>
        <button class="mode-button" type="button" data-mode="taxonomy" aria-pressed="false">分类结构</button>
        <button class="mode-button" type="button" data-mode="combined" aria-pressed="false">综合视图</button>
      </div>
      <div class="search-wrap">
        <input class="search" id="search" type="search" placeholder="搜索概念、项目或 MOC" autocomplete="off" aria-label="搜索节点">
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <div class="tools">
        <button class="tool-button icon-button mobile-filter" id="filterButton" type="button" aria-label="打开筛选" title="打开筛选"><svg data-icon="filter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M7 12h10M10 19h4"/></svg></button>
        <button class="tool-button icon-button" id="fitButton" type="button" title="适应视图" aria-label="适应视图"><svg data-icon="fit" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg></button>
        <button class="tool-button icon-button" id="rebuildTaxonomy" type="button" title="全局重组分类" aria-label="全局重组分类"><svg data-icon="refresh" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg></button>
        <button class="tool-button text-button" id="layoutButton" type="button">重新布局</button>
        <label class="switch-row"><input id="labelsToggle" type="checkbox"> 全部标签</label>
      </div>
    </header>
    <div class="workspace">
      <aside class="filters" id="filters" aria-label="图谱筛选">
        <h2 class="panel-title">筛选与概览 <button class="panel-close" id="closeFilters" type="button" aria-label="关闭筛选">×</button></h2>
        <div class="metrics">
          <div class="metric"><strong id="nodeCount">–</strong><span>节点</span></div>
          <div class="metric"><strong id="edgeCount">–</strong><span>边</span></div>
          <div class="metric"><strong id="visibleCount">–</strong><span>当前可见</span></div>
          <div class="metric"><strong id="brokenCount">–</strong><span>断链</span></div>
        </div>
        <section class="filter-section"><h3>分类</h3><div class="check-list" id="categoryFilters"></div></section>
        <section class="filter-section"><h3>项目</h3><div class="check-list" id="projectFilters"></div></section>
        <section class="filter-section"><label class="switch-row"><input id="neighborOnly" type="checkbox" disabled> 仅显示选中节点及一跳邻居</label></section>
      </aside>

      <main class="graph-shell">
        <div class="graph" id="graph" aria-label="知识图谱画布"></div>
        <div class="graph-legend" id="graphLegend" aria-hidden="true"></div>
        <div class="toast" id="toast" role="status" hidden></div>
        <div class="overlay" id="loading"><div class="overlay-box"><div class="spinner"></div><p>正在载入并布局图谱...</p></div></div>
        <div class="overlay" id="errorState" hidden><div class="overlay-box"><h2>图谱载入失败</h2><p id="errorText"></p><a href="viewer.html?f=graph.md">打开 Mermaid 备用图谱</a></div></div>
        <div class="overlay" id="emptyState" hidden><div class="overlay-box"><h2>没有匹配节点</h2><p>调整分类、项目或一跳筛选条件。</p></div></div>
      </main>

      <aside class="details" id="details" aria-label="节点详情">
        <h2 class="panel-title">节点详情 <button class="panel-close" id="closeDetails" type="button" aria-label="关闭详情">×</button></h2>
        <div id="detailContent" class="detail-empty">选择一个节点查看摘要、标签和邻居。</div>
      </aside>
    </div>
  </div>
  <button class="mobile-scrim" id="mobileScrim" aria-label="关闭面板"></button>

  <script>
    const PROJECT_TAGS = ['GSAD', 'ChronoLink', 'EvidenceFirst', 'TripleChecker', 'CoMaGRAG'];
    const CATEGORY_COLOR = '#d3924a';
    const urlParams = new URLSearchParams(location.search);
    const profileParam = urlParams.get('profile');
    const explicitMode = ['knowledge', 'taxonomy', 'combined'].includes(urlParams.get('mode')) ? urlParams.get('mode') : null;
    const PROFILE = ['knowledge', 'interview'].includes(profileParam) ? profileParam : 'knowledge';
    const GRAPH_DATA_URLS = { knowledge: 'graph-data.json', interview: 'interview-graph-data.json' };
    const GRAPH_STATE_KEYS = { knowledge: 'radar-graph-state-knowledge-v1', interview: 'radar-graph-state-interview-v1' };
    const GRAPH_DATA_URL = GRAPH_DATA_URLS[PROFILE];
    const GRAPH_STATE_KEY = GRAPH_STATE_KEYS[PROFILE];
    const LEGACY_GRAPH_STATE_KEY = 'radar-graph-state-v1';
    const WORKBENCH_ORIGIN = 'http://127.0.0.1:18080';
    function readPersistedState() {
      try {
        const stored = sessionStorage.getItem(GRAPH_STATE_KEY)
          || (PROFILE === 'knowledge' ? sessionStorage.getItem(LEGACY_GRAPH_STATE_KEY) : null);
        const value = JSON.parse(stored || 'null');
        if (!value || value.version !== 1 || !['knowledge', 'taxonomy', 'combined'].includes(value.mode)) return null;
        const finite = (number) => Number.isFinite(number) ? number : null;
        return {
          version: 1, mode: value.mode,
          categories: Array.isArray(value.categories) ? value.categories.filter((item) => typeof item === 'string') : [],
          projects: Array.isArray(value.projects) ? value.projects.filter((item) => typeof item === 'string') : [],
          neighborOnly: Boolean(value.neighborOnly), showAllLabels: Boolean(value.showAllLabels),
          selectedNodeId: typeof value.selectedNodeId === 'string' ? value.selectedNodeId : null,
          zoom: finite(value.zoom),
          pan: value.pan && finite(value.pan.x) !== null && finite(value.pan.y) !== null ? { x: value.pan.x, y: value.pan.y } : null
        };
      } catch (_error) { return null; }
    }
    const state = {
      payload: null, cy: null, selected: null, showAllLabels: false, mode: 'knowledge',
      revision: null, refreshing: false, handlersBound: false, restoring: false,
      restore: readPersistedState(), lastTap: { id: null, at: 0 }
    };
    if (state.restore) { state.mode = state.restore.mode; state.showAllLabels = state.restore.showAllLabels; }
    if (explicitMode) state.mode = explicitMode;
    const el = Object.fromEntries([
      'search', 'searchResults', 'categoryFilters', 'projectFilters', 'neighborOnly', 'fitButton', 'layoutButton',
      'labelsToggle', 'loading', 'errorState', 'errorText', 'emptyState', 'detailContent', 'toolbarStats',
      'nodeCount', 'edgeCount', 'visibleCount', 'brokenCount', 'filterButton', 'closeFilters', 'closeDetails',
      'mobileScrim', 'modeSwitch', 'rebuildTaxonomy', 'graphLegend', 'toast'
    ].map((id) => [id, document.getElementById(id)]));

    function createText(tag, text, className) {
      const node = document.createElement(tag);
      node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function closePanels() { document.body.classList.remove('filters-open', 'details-open'); }

    function checkboxRow({ value, label, color, count, checked, group, depth = 0 }) {
      const row = document.createElement('label');
      row.className = group === 'taxonomy' ? 'check-row taxonomy-reference' : 'check-row';
      row.style.setProperty('--depth', String(depth));
      const input = document.createElement('input');
      input.type = 'checkbox'; input.value = value; input.checked = checked; input.dataset.group = group;
      input.addEventListener('change', applyFilters);
      const swatch = createText('span', '', 'swatch'); swatch.style.background = color;
      row.append(input, swatch, createText('span', label), createText('span', String(count), 'count'));
      return row;
    }

    function taxonomyMaps() {
      const categories = state.payload.taxonomy?.categories || [];
      const byId = new Map(categories.map((category) => [category.id, category]));
      const children = new Map(categories.map((category) => [category.id, []]));
      categories.forEach((category) => category.parents.forEach((parent) => children.get(parent)?.push(category.id)));
      return { categories, byId, children };
    }

    function appendCategoryReference(categoryId, depth, visited, maps) {
      const category = maps.byId.get(categoryId);
      if (!category || category.status === 'merged') return;
      const count = state.payload.taxonomy.memberships.filter((item) => item.category === categoryId).length;
      const restored = state.restore?.mode === state.mode ? state.restore.categories : [];
      el.categoryFilters.append(checkboxRow({ value: categoryId, label: category.name, color: CATEGORY_COLOR, count, checked: restored.length ? restored.includes(categoryId) : true, group: 'taxonomy', depth }));
      if (visited.has(categoryId)) return;
      const nextVisited = new Set(visited); nextVisited.add(categoryId);
      (maps.children.get(categoryId) || []).sort().forEach((child) => appendCategoryReference(child, depth + 1, nextVisited, maps));
    }

    function buildFilters() {
      el.categoryFilters.replaceChildren();
      el.projectFilters.replaceChildren();
      const internalPayloadNodes = state.payload.nodes.filter((node) => !node.external);
      if (state.mode === 'knowledge') {
        for (const [category, color] of Object.entries(state.payload.categories)) {
          const count = internalPayloadNodes.filter((node) => node.category === category).length;
          const restored = state.restore?.mode === state.mode ? state.restore.categories : [];
          el.categoryFilters.append(checkboxRow({ value: category, label: category, color, count, checked: restored.length ? restored.includes(category) : true, group: 'category' }));
        }
      } else {
        const maps = taxonomyMaps();
        const roots = maps.categories.filter((category) => category.status !== 'merged' && !category.parents.some((parent) => maps.byId.get(parent)?.status !== 'merged'));
        roots.sort((a, b) => a.name.localeCompare(b.name)).forEach((root) => appendCategoryReference(root.id, 0, new Set(), maps));
      }
      for (const project of PROJECT_TAGS) {
        const count = internalPayloadNodes.filter((node) => node.tags.includes(project)).length;
        el.projectFilters.append(checkboxRow({ value: project, label: project, color: '#8a5da2', count, checked: state.restore?.projects.includes(project) || false, group: 'project' }));
      }
    }

    function externalViewerHref(node) {
      const source = new URL(node.href || 'viewer.html', location.href).searchParams.get('f') || `pages/${node.label}.md`;
      return `viewer.html?section=knowledge&f=${encodeURIComponent(source)}`;
    }

    function knowledgeElements(payload) {
      return [
        ...payload.nodes.map((node) => ({ group: 'nodes', data: {
          ...node,
          nodeType: node.external ? 'external' : 'page',
          href: node.external ? externalViewerHref(node) : node.href
        } })),
        ...payload.edges.map((edge) => ({ group: 'edges', data: { ...edge, edgeType: 'knowledge' } }))
      ];
    }

    function taxonomyElements(payload) {
      const categories = payload.taxonomy?.categories || [];
      const active = categories.filter((category) => category.status !== 'merged');
      const activeIds = new Set(active.map((category) => category.id));
      const memberCounts = new Map();
      (payload.taxonomy?.memberships || []).forEach((item) => memberCounts.set(item.category, (memberCounts.get(item.category) || 0) + 1));
      const nodes = active.map((category) => ({ group: 'nodes', data: {
        ...category, id: `category:${category.id}`, categoryId: category.id, label: category.name,
        nodeType: 'category', source: category.source || (category.automatic ? 'automatic' : 'seed'), degree: memberCounts.get(category.id) || 0,
        size: Number(category.size) || 58, lifecycle: category.lifecycle || category.status || 'neutral'
      }}));
      const edges = [];
      active.forEach((category) => {
        category.parents.filter((parent) => activeIds.has(parent)).forEach((parent) => edges.push({ group: 'edges', data: {
          id: `parent:${category.id}:${parent}`, source: `category:${category.id}`, target: `category:${parent}`, edgeType: 'parent'
        }}));
        category.related.filter((related) => activeIds.has(related) && category.id < related).forEach((related) => edges.push({ group: 'edges', data: {
          id: `related:${category.id}:${related}`, source: `category:${category.id}`, target: `category:${related}`, edgeType: 'related'
        }}));
      });
      (payload.taxonomy?.candidates || []).forEach((candidate) => {
        const id = `candidate:${candidate.id}`;
        const candidateName = candidate.name || candidate.label || candidate.id;
        const members = Array.isArray(candidate.members) ? candidate.members : [];
        const targetSize = Number(candidate.targetSize || candidate.target_size) || 3;
        nodes.push({ group: 'nodes', data: { ...candidate, id, categoryId: candidate.id, name: candidateName, label: `${candidateName} ${members.length}/${targetSize}`,
          nodeType: 'candidate', status: candidate.status || 'candidate', lifecycle: 'candidate', source: 'automatic',
          progress: candidate.progress || `${members.length}/${targetSize}`, targetSize, size: 52, degree: members.length } });
        (candidate.related_category_ids || candidate.relatedCategories || []).forEach((related) => {
          if (activeIds.has(related)) edges.push({ group: 'edges', data: { id: `candidate-related:${candidate.id}:${related}`, source: id, target: `category:${related}`, edgeType: 'related' } });
        });
      });
      return [...nodes, ...edges];
    }

    function taxonomyStatusSummary(payload) {
      const taxonomy = payload.taxonomy || {};
      const stats = taxonomy.stats || payload.stats || {};
      const run = taxonomy.lastRun || taxonomy.last_run || {};
      const outcome = run.outcome || taxonomy.status || stats.status || 'neutral';
      const allowed = new Set(['neutral', 'candidate', 'adopted', 'rejected', 'failed']);
      const stateLabel = allowed.has(outcome) ? outcome : (stats.candidates ? 'candidate' : 'neutral');
      const candidates = Number(stats.candidates ?? (taxonomy.candidates || []).length ?? 0);
      return `分类状态 ${stateLabel} · 候选 ${candidates}`;
    }

    function taxonomyRepresentativeElements(categoryNode) {
      const categoryId = categoryNode?.data?.('categoryId');
      const taxonomy = state.payload?.taxonomy || {};
      const categories = Array.isArray(state.payload?.taxonomy?.categories) ? state.payload.taxonomy.categories : [];
      const candidates = Array.isArray(taxonomy.candidates) ? taxonomy.candidates : [];
      // Preserve the missing-category guard contract: if (!categoryId || !Array.isArray(categories)) return []
      if (!categoryId) return [];
      const category = categories.find((item) => item.id === categoryId) || candidates.find((item) => item.id === categoryId);
      const representatives = category?.representatives || [];
      const candidateMembers = Array.isArray(category?.members) ? category.members : (category?.candidateMembers || []);
      const isCandidate = categoryNode.data('nodeType') === 'candidate'
        || category?.nodeType === 'candidate' || category?.status === 'candidate' || category?.lifecycle === 'candidate';
      const ids = isCandidate ? candidateMembers : representatives;
      const pages = Array.isArray(state.payload?.nodes)
        ? state.payload.nodes.filter((page) => ids.includes(page.id) || ids.includes(page.href) || ids.includes(page.label))
        : [];
      return pages.map((page, index) => ({ group: 'nodes', data: {
        ...page, id: `representative:${categoryId}:${page.id}`, nodeType: isCandidate ? 'candidate-member' : 'representative',
        categoryId, label: page.label, size: 34, href: page.href
      }, position: { x: categoryNode.position('x') + Math.cos(index) * 90, y: categoryNode.position('y') + Math.sin(index) * 90 } })).concat(pages.map((page) => ({ group: 'edges', data: {
        id: `membership:${categoryId}:${page.id}`, source: categoryNode.id(), target: `representative:${categoryId}:${page.id}`, edgeType: isCandidate ? 'candidate-member' : 'membership'
      }})));
    }

    function collapseTaxonomyMembers() {
      if (!state.cy) return;
      state.cy.nodes('[nodeType = "representative"], [nodeType = "candidate-member"]').remove();
    }

    function expandTaxonomyCategory(node) {
      if (state.mode !== 'taxonomy' || !['category', 'candidate'].includes(node.data('nodeType'))) return;
      collapseTaxonomyMembers();
      const elements = taxonomyRepresentativeElements(node);
      state.cy.add(elements);
      state.cy.nodes('[nodeType = "representative"], [nodeType = "candidate-member"]').lock();
      state.cy.layout({ name: 'fcose', randomize: false, fit: false, animate: true, padding: 40 }).run();
    }

    function combinedElements(payload) {
      const elements = [...knowledgeElements(payload), ...taxonomyElements(payload)];
      (payload.taxonomy?.memberships || []).forEach((membership) => elements.push({ group: 'edges', data: {
        id: `membership:${membership.page}:${membership.category}`, source: membership.page,
        target: `category:${membership.category}`, edgeType: 'membership', score: membership.score
      }}));
      return elements;
    }

    function elementsFor(mode) {
      if (mode === 'taxonomy') return taxonomyElements(state.payload);
      if (mode === 'combined') return combinedElements(state.payload);
      return knowledgeElements(state.payload);
    }

    function checkedValues(group) {
      return new Set([...document.querySelectorAll(`input[data-group="${group}"]:checked`)].map((input) => input.value));
    }

    function persistGraphState() {
      if (!state.cy || state.restoring) return;
      const group = state.mode === 'knowledge' ? 'category' : 'taxonomy';
      const pan = state.cy.pan();
      sessionStorage.setItem(GRAPH_STATE_KEY, JSON.stringify({
        version: 1, mode: state.mode, categories: [...checkedValues(group)], projects: [...checkedValues('project')],
        neighborOnly: el.neighborOnly.checked, showAllLabels: state.showAllLabels,
        selectedNodeId: state.selected?.id() || null, zoom: state.cy.zoom(), pan: { x: pan.x, y: pan.y }
      }));
    }

    function restoreGraphViewport(restored = state.restore) {
      if (!state.cy || !restored) return;
      if (restored.zoom !== null) state.cy.zoom(restored.zoom);
      if (restored.pan) state.cy.pan(restored.pan);
    }

    function notifyGraphContext() {
      if (window.parent === window || !state.cy) return;
      const group = state.mode === 'knowledge' ? 'category' : 'taxonomy';
      const visibleNodes = state.cy.nodes().not('.filtered');
      const visibleEdges = state.cy.edges().not('.filtered');
      const selected = state.selected ? {
        id: state.selected.id(), label: state.selected.data('label'),
        nodeType: state.selected.data('nodeType') || state.selected.data('kind') || 'node',
        neighbors: state.selected.closedNeighborhood().nodes().not(state.selected).map((node) => node.data('label')).filter(Boolean).slice(0, 20)
      } : null;
      const modeLabel = el.modeSwitch.querySelector(`[data-mode="${state.mode}"]`)?.textContent?.trim() || state.mode;
      window.parent.postMessage({ type: 'kb-context', context: {
        kind: 'graph', profile: PROFILE, section: PROFILE, mode: state.mode, modeLabel,
        visibleNodes: visibleNodes.not('[nodeType = "external"]').length,
        visibleEdges: visibleEdges.length, categories: [...checkedValues(group)], projects: [...checkedValues('project')], selected
      } }, WORKBENCH_ORIGIN);
    }

    function baseNodeVisible(node, categories, projects) {
      if (node.data('nodeType') === 'category') return categories.has(node.data('categoryId'));
      const categoryMatch = state.mode !== 'knowledge' || !node.data('category') || categories.has(node.data('category'));
      const tags = node.data('tags') || [];
      const projectMatch = projects.size === 0 || tags.some((tag) => projects.has(tag));
      if (state.mode !== 'combined') return categoryMatch && projectMatch;
      const memberships = state.payload.taxonomy.memberships.filter((item) => item.page === node.id());
      return projectMatch && (memberships.length === 0 || memberships.some((item) => categories.has(item.category)));
    }

    function applyFilters() {
      if (!state.cy) return;
      const group = state.mode === 'knowledge' ? 'category' : 'taxonomy';
      const categories = checkedValues(group);
      const projects = checkedValues('project');
      let allowed = new Set(state.cy.nodes().filter((node) => baseNodeVisible(node, categories, projects)).map((node) => node.id()));
      if (el.neighborOnly.checked && state.selected) {
        const focused = new Set(state.selected.closedNeighborhood().nodes().map((node) => node.id()));
        allowed = new Set([...allowed].filter((id) => focused.has(id)));
      }
      state.cy.batch(() => {
        state.cy.nodes().forEach((node) => node.toggleClass('filtered', !allowed.has(node.id())));
        state.cy.edges().forEach((edge) => edge.toggleClass('filtered', !allowed.has(edge.source().id()) || !allowed.has(edge.target().id())));
      });
      const internalVisibleNodes = state.cy.nodes().not('.filtered').not('[nodeType = "external"]');
      const visible = internalVisibleNodes.length;
      el.visibleCount.textContent = visible;
      el.emptyState.hidden = visible !== 0;
      updateLabels();
      persistGraphState();
      notifyGraphContext();
    }

    function updateLabels() {
      if (!state.cy) return;
      state.cy.nodes().forEach((node) => {
        const important = node.data('nodeType') === 'category' || Number(node.data('degree')) >= 18;
        const highlighted = node.hasClass('selected') || node.hasClass('neighbor') || node.hasClass('search-hit');
        node.toggleClass('show-label', state.showAllLabels || important || highlighted);
      });
    }

    function runLayout(animate = true) {
      if (!state.cy || state.cy.nodes().length === 0) return;
      if (state.mode === 'taxonomy' && state.cy.edges().length === 0) {
        const compactMobile = state.cy.width() <= 480;
        const gridWidth = Math.min(state.cy.width(), compactMobile ? 260 : 660);
        const gridHeight = Math.min(state.cy.height(), compactMobile ? 480 : 500);
        if (compactMobile) state.cy.one('layoutstop', () => {
          state.cy.zoom(0.72);
          state.cy.center();
        });
        state.cy.layout({
          name: 'grid', animate, animationDuration: 420, fit: true, padding: 50,
          avoidOverlap: true, avoidOverlapPadding: 30, spacingFactor: 1.25,
          boundingBox: { x1: 0, y1: 0, w: gridWidth, h: gridHeight },
          cols: compactMobile ? 2 : Math.min(3, state.cy.nodes().length)
        }).run();
        return;
      }
      state.cy.layout({
        name: 'fcose', quality: 'default', randomize: true, animate, animationDuration: 650,
        fit: true, padding: 44, nodeRepulsion: 9000, idealEdgeLength: state.mode === 'combined' ? 75 : 95,
        edgeElasticity: 0.35, nestingFactor: 0.1, gravity: 0.3, numIter: 2500, tile: true
      }).run();
    }

    function clearFocus({ close = false } = {}) {
      if (!state.cy) return;
      state.cy.elements().removeClass('selected neighbor faded search-hit');
      state.selected = null;
      el.neighborOnly.checked = false; el.neighborOnly.disabled = true;
      el.detailContent.replaceChildren(createText('div', '选择节点查看关系与归属。', 'detail-empty'));
      if (close) document.body.classList.remove('details-open');
      applyFilters();
    }

    function focusNode(node, { center = true } = {}) {
      state.cy.elements().removeClass('selected neighbor faded search-hit');
      state.selected = node;
      const neighborhood = node.closedNeighborhood();
      node.addClass('selected'); neighborhood.nodes().not(node).addClass('neighbor');
      state.cy.elements().not(neighborhood).addClass('faded');
      el.neighborOnly.disabled = false;
      renderDetails(node); applyFilters();
      if (center) state.cy.animate({ fit: { eles: neighborhood.not('.filtered'), padding: 80 }, duration: 420 });
      if (window.innerWidth <= 1000) document.body.classList.add('details-open');
    }

    function relationButton(categoryId) {
      const category = state.payload.taxonomy.categories.find((item) => item.id === categoryId);
      const button = createText('button', category?.name || categoryId, 'neighbor-button');
      button.type = 'button';
      button.addEventListener('click', () => { const node = state.cy.getElementById(`category:${categoryId}`); if (node.length) focusNode(node); });
      return button;
    }

    function renderCategoryDetails(data) {
      const content = document.createDocumentFragment();
      content.append(createText('h3', data.name || data.label, 'node-title'));
      const meta = createText('div', '', 'node-meta');
      meta.append(createText('span', '分类', 'badge'), createText('span', data.status, 'badge'), createText('span', data.namingStatus, 'badge'));
      content.append(meta, createText('p', data.definition || '暂无边界定义。', 'summary'));
      const grid = createText('div', '', 'detail-grid');
      grid.append(
        createText('span', '页面数'), createText('span', String(data.degree || 0)),
        createText('span', '最近变化'), createText('span', data.updatedAt || '—'),
        createText('span', '稳定轮次'), createText('span', String(data.stableRuns || 0))
      );
      content.append(grid);
      const relations = [
        ['上位分类', data.parents || []],
        ['下位分类', state.payload.taxonomy.categories.filter((item) => item.parents.includes(data.categoryId)).map((item) => item.id)],
        ['相关分类', data.related || []]
      ];
      relations.forEach(([label, ids]) => {
        if (!ids.length) return;
        const section = createText('section', '', 'neighbors'); section.append(createText('h3', label));
        const list = createText('div', '', 'neighbor-list'); ids.forEach((id) => list.append(relationButton(id)));
        section.append(list); content.append(section);
      });
      if (data.aliases?.length) content.append(createText('p', `别名：${data.aliases.join('、')}`, 'summary'));
      const recent = state.payload.taxonomy.events.filter((event) => event.categoryIds.includes(data.categoryId)).slice(-5).reverse();
      if (recent.length) content.append(createText('p', recent.map((event) => `${event.createdAt} ${event.type}：${event.reason}`).join('\n'), 'summary'));
      el.detailContent.replaceChildren(content);
    }

    function renderMembershipDetails(data, content) {
      const memberships = state.payload.taxonomy.memberships.filter((item) => item.page === data.id).sort((a, b) => b.score - a.score);
      if (!memberships.length) return;
      const section = createText('section', '', 'neighbors'); section.append(createText('h3', `动态分类 ${memberships.length}`));
      const list = createText('div', '', 'neighbor-list');
      memberships.forEach((membership) => {
        const category = state.payload.taxonomy.categories.find((item) => item.id === membership.category);
        const signals = Object.entries(membership.signals).map(([name, value]) => `${name} ${Number(value).toFixed(2)}`).join(' · ');
        const button = createText('button', `${category?.name || membership.category} · ${Number(membership.score).toFixed(2)}\n${membership.reason}\n${signals}`, 'neighbor-button');
        button.type = 'button';
        button.addEventListener('click', () => { const node = state.cy.getElementById(`category:${membership.category}`); if (node.length) focusNode(node); });
        list.append(button);
      });
      section.append(list); content.append(section);
    }

    function renderDetails(node) {
      const data = node.data();
      if (data.nodeType === 'category') { renderCategoryDetails(data); return; }
      const content = document.createDocumentFragment();
      content.append(createText('h3', data.label, 'node-title'));
      const meta = createText('div', '', 'node-meta');
      meta.append(createText('span', data.kind === 'project' ? '项目' : data.kind === 'moc' ? 'MOC' : '概念', 'badge'));
      for (const tag of data.tags || []) meta.append(createText('span', tag, 'badge'));
      if (data.confidence) meta.append(createText('span', `信度 ${data.confidence}`, 'badge'));
      content.append(meta, createText('p', data.summary || '该页面暂无摘要。', 'summary'));
      const grid = createText('div', '', 'detail-grid');
      grid.append(createText('span', '连接数'), createText('span', String(data.degree)), createText('span', '主分类'), createText('span', data.category || '结构页'));
      content.append(grid);
      const link = createText('a', '在 Viewer 打开', 'open-link'); link.href = node.data('href'); content.append(link);
      renderMembershipDetails(data, content);
      const neighbors = node.neighborhood('node').filter((item) => item.data('nodeType') === 'page').sort((a, b) => Number(b.data('degree')) - Number(a.data('degree')));
      const section = createText('section', '', 'neighbors'); section.append(createText('h3', `知识邻居 ${neighbors.length}`));
      const list = createText('div', '', 'neighbor-list');
      neighbors.slice(0, 20).forEach((neighbor) => {
        const button = createText('button', neighbor.data('label'), 'neighbor-button'); button.type = 'button';
        button.addEventListener('click', () => focusNode(neighbor)); list.append(button);
      });
      section.append(list); content.append(section);
      el.detailContent.replaceChildren(content);
    }

    function renderSearchResults(query) {
      el.searchResults.replaceChildren();
      if (!query.trim()) { el.searchResults.hidden = true; state.cy?.nodes().removeClass('search-hit'); updateLabels(); return; }
      const key = query.trim().toLocaleLowerCase();
      const matches = state.cy.nodes().filter((node) => {
        const aliases = node.data('aliases') || [];
        return node.data('label').toLocaleLowerCase().includes(key) || aliases.some((alias) => alias.toLocaleLowerCase().includes(key));
      }).sort((a, b) => Number(b.data('degree')) - Number(a.data('degree'))).slice(0, 8);
      state.cy.nodes().removeClass('search-hit'); matches.addClass('search-hit'); updateLabels();
      for (const node of matches) {
        const button = createText('button', node.data('label'), 'search-result'); button.type = 'button';
        button.append(createText('small', node.data('nodeType') === 'category' ? `${node.data('status')} · ${node.data('degree')} 页` : `${node.data('category') || '结构页'} · 度 ${node.data('degree')}`));
        button.addEventListener('click', () => { el.search.value = node.data('label'); el.searchResults.hidden = true; focusNode(node); });
        el.searchResults.append(button);
      }
      el.searchResults.hidden = matches.length === 0;
    }

    function updateLegend() {
      el.graphLegend.replaceChildren();
      const items = state.mode === 'knowledge' ? [['知识双链', '']] : state.mode === 'taxonomy'
        ? [['上位关系', ''], ['相关关系', 'related'], ['种子分类', 'seed-source'], ['自动分类', 'automatic-source'], ['候选分类', 'candidate-source']]
        : [['知识双链', ''], ['分类归属', 'membership'], ['相关关系', 'related']];
      items.forEach(([label, kind]) => {
        const item = createText('span', '', 'legend-item'); item.append(createText('span', '', `legend-line ${kind}`.trim()), createText('span', label)); el.graphLegend.append(item);
      });
    }

    function seedInitialPositions(nodes) {
      const columns = Math.max(1, Math.ceil(Math.sqrt(nodes.length)));
      nodes.forEach((node, index) => node.position({
        x: 60 + (index % columns) * 72,
        y: 60 + Math.floor(index / columns) * 72
      }));
    }

    function replaceGraphElements(mode) {
      if (!state.cy || !state.payload) return;
      const restored = state.restore?.mode === mode ? state.restore : null;
      state.restoring = Boolean(restored);
      state.mode = mode;
      state.selected = null;
      state.cy.batch(() => {
        state.cy.elements().remove();
        const added = state.cy.add(elementsFor(mode));
        seedInitialPositions(added.nodes());
      });
      [...el.modeSwitch.querySelectorAll('[data-mode]')].forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
      buildFilters(); updateLegend(); clearFocus();
      state.showAllLabels = restored ? restored.showAllLabels : state.showAllLabels;
      el.labelsToggle.checked = state.showAllLabels;
      if (restored?.selectedNodeId) {
        const selected = state.cy.getElementById(restored.selectedNodeId);
        if (selected.length) focusNode(selected, { center: false });
      }
      if (restored?.neighborOnly && state.selected) { el.neighborOnly.checked = true; applyFilters(); }
      const internalNodes = state.cy.nodes().not('[nodeType = "external"]');
      const nodes = internalNodes.length; const edges = state.cy.edges().length;
      el.nodeCount.textContent = nodes; el.edgeCount.textContent = edges; el.visibleCount.textContent = nodes;
      el.brokenCount.textContent = state.payload.stats.broken;
      el.toolbarStats.textContent = `${nodes} 节点 · ${edges} 边`;
      if (state.mode === 'taxonomy') el.toolbarStats.textContent = `${taxonomyStatusSummary(state.payload)} · ${nodes} 节点 · ${edges} 边`;
      bindModeIndependentHandlersOnce();
      if (restored) state.cy.one('layoutstop', () => setTimeout(() => {
        restoreGraphViewport(restored); state.restoring = false; state.restore = null; persistGraphState(); notifyGraphContext();
      }, 0));
      else { state.restoring = false; persistGraphState(); notifyGraphContext(); }
      runLayout(false);
    }

    function bindModeIndependentHandlersOnce() {
      if (!state.cy || state.handlersBound) return;
      state.handlersBound = true;
      state.cy.on('tap', 'node', (event) => {
        const node = event.target; const now = Date.now();
        if (state.mode === 'taxonomy' && ['category', 'candidate'].includes(node.data('nodeType'))) {
          if (state.lastTap.id === node.id() && now - state.lastTap.at < 500) { collapseTaxonomyMembers(); clearFocus({ close: true }); }
          else { expandTaxonomyCategory(node); focusNode(node); }
          state.lastTap = { id: node.id(), at: now }; return;
        }
        if (node.data('href') && state.lastTap.id === node.id() && now - state.lastTap.at < 350) location.href = node.data('href');
        else focusNode(node);
        state.lastTap = { id: node.id(), at: now };
      });
      state.cy.on('tap', (event) => { if (event.target === state.cy) { collapseTaxonomyMembers(); clearFocus({ close: true }); } });
      state.cy.on('layoutstop', () => { el.loading.hidden = true; state.cy.fit(state.cy.elements().not('.filtered'), 42); persistGraphState(); });
      state.cy.on('pan zoom', () => { window.clearTimeout(persistGraphState.timer); persistGraphState.timer = window.setTimeout(persistGraphState, 120); });
    }

    function initGraph(payload) {
      // Legacy compact sizing contract: compactGraph ? 84 : Math.min(70, 42 + Math.sqrt(Number(node.data('degree')) + 1) * 4)
      state.payload = payload; state.selected = null; state.handlersBound = false;
      const compactGraph = window.matchMedia('(max-width: 760px)').matches;
      el.categoryFilters.replaceChildren(); el.projectFilters.replaceChildren();
      el.search.value = ''; el.searchResults.replaceChildren(); el.searchResults.hidden = true;
      el.neighborOnly.checked = false; el.neighborOnly.disabled = true;
      el.detailContent.replaceChildren(createText('div', '选择节点查看关系与归属。', 'detail-empty'));
      state.cy = cytoscape({
        container: document.getElementById('graph'), elements: [], minZoom: 0.12, maxZoom: 3.2,
        style: [
          { selector: 'node', style: {
            'background-color': (node) => node.data('nodeType') === 'category' ? CATEGORY_COLOR : node.data('kind') === 'project' ? '#9b68ad' : node.data('kind') === 'moc' ? '#26323d' : (payload.categories[node.data('category')] || '#7a8792'),
            'width': (node) => node.data('nodeType') === 'category' ? Number(node.data('size')) || 58 : node.data('nodeType') === 'representative' || node.data('nodeType') === 'candidate-member' ? 34 : Math.min(48, 17 + Math.sqrt(Number(node.data('degree')) + 1) * 3.2),
            'height': (node) => node.data('nodeType') === 'category' ? Number(node.data('size')) || 58 : node.data('nodeType') === 'representative' || node.data('nodeType') === 'candidate-member' ? 34 : Math.min(48, 17 + Math.sqrt(Number(node.data('degree')) + 1) * 3.2),
            'shape': (node) => node.data('nodeType') === 'category' || node.data('nodeType') === 'representative' || node.data('nodeType') === 'candidate-member' ? 'ellipse' : node.data('kind') === 'project' ? 'diamond' : node.data('kind') === 'moc' ? 'round-rectangle' : 'ellipse',
            'border-width': 1, 'border-color': '#dce4ea', 'label': '', 'color': '#f7fafc', 'font-size': 10,
            'text-outline-width': 3, 'text-outline-color': '#111820', 'text-wrap': 'wrap', 'text-max-width': 130, 'text-valign': 'bottom', 'text-margin-y': 8
          }},
          { selector: 'node[nodeType = "category"]', style: { 'label': 'data(label)', 'border-width': 2, 'border-color': '#ffe2b3', 'font-size': compactGraph ? 20 : 14, 'text-wrap': 'wrap', 'text-max-width': 120 } },
          { selector: 'node[nodeType = "category"][source = "seed"]', style: { 'background-color': '#b97832', 'border-color': '#ffe2b3', 'border-style': 'solid' } },
          { selector: 'node[nodeType = "category"][source = "automatic"]', style: { 'background-color': '#6176a8', 'border-color': '#b8c8ff', 'border-style': 'double' } },
          { selector: 'node[nodeType = "candidate"], node[lifecycle = "candidate"]', style: { 'border-style': 'dashed', 'border-color': '#6dc5ad', 'background-color': '#3f8f78' } },
          { selector: 'node[nodeType = "representative"], node[nodeType = "candidate-member"]', style: { 'shape': 'ellipse', 'width': 34, 'height': 34, 'text-wrap': 'wrap', 'text-max-width': 90 } },
          { selector: 'node[nodeType = "external"]', style: { 'shape': 'round-rectangle', 'background-color': '#ffffff', 'border-width': 2, 'border-style': 'dashed', 'border-color': '#0b6b57', 'color': '#20242a', 'text-outline-color': '#ffffff' } },
          { selector: 'node[status = "forming"]', style: { 'border-style': 'dashed' } },
          { selector: 'node.show-label', style: { 'label': 'data(label)' } },
          { selector: 'edge', style: { 'width': 1, 'line-color': '#5b6875', 'target-arrow-color': '#5b6875', 'target-arrow-shape': 'triangle', 'arrow-scale': .55, 'curve-style': 'bezier', 'opacity': .38 } },
          { selector: 'edge[edgeType = "parent"]', style: { 'width': 2, 'line-color': '#aab8c3', 'target-arrow-color': '#aab8c3', 'opacity': .75 } },
          { selector: 'edge[edgeType = "related"]', style: { 'line-style': 'dashed', 'line-color': '#d7a85a', 'target-arrow-shape': 'none', 'curve-style': 'bezier', 'opacity': .34 } },
          { selector: 'edge[edgeType = "membership"]', style: { 'line-color': '#6dc5ad', 'target-arrow-color': '#6dc5ad', 'target-arrow-shape': 'none', 'opacity': .28 } },
          { selector: '.selected', style: { 'border-width': 4, 'border-color': '#fff', 'z-index': 20 } },
          { selector: 'node.neighbor', style: { 'border-width': 2, 'border-color': '#9ee8d4', 'z-index': 10 } },
          { selector: '.faded', style: { 'opacity': .09 } }, { selector: '.filtered', style: { 'display': 'none' } },
          { selector: '.search-hit', style: { 'border-width': 4, 'border-color': '#f5cf69' } }
        ]
      });
      // data(status) determines forming/stable lifecycle styling through Cytoscape selectors.
      replaceGraphElements(state.mode);
    }

    async function fetchRevision() {
      const response = await fetch('/api/revision', { cache: 'no-store' });
      if (!response.ok) throw new Error(`revision: HTTP ${response.status}`);
      const status = await response.json();
      if (!status.ok || typeof status.revision !== 'string') throw new Error(status.error || '图谱版本响应无效');
      return status;
    }

    async function loadGraph(revision) {
      if (state.refreshing) return;
      if (state.cy) { persistGraphState(); state.restore = readPersistedState(); }
      state.refreshing = true;
      el.loading.hidden = false;
      try {
        const response = await fetch(GRAPH_DATA_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`${GRAPH_DATA_URL}: HTTP ${response.status}`);
        const payload = await response.json();
        if (!payload || !Array.isArray(payload.nodes) || !Array.isArray(payload.edges) || !payload.categories || !payload.stats) throw new Error(`${GRAPH_DATA_URL} 结构无效`);
        state.cy?.destroy();
        state.cy = null;
        initGraph(payload);
        state.revision = revision || state.revision;
        el.errorState.hidden = true;
      } catch (error) {
        if (state.cy) showToast(`图谱刷新失败，已保留当前视图：${error?.message || String(error)}`);
        else { el.loading.hidden = true; el.errorText.textContent = error?.message || String(error); el.errorState.hidden = false; }
        throw error;
      } finally {
        state.refreshing = false;
      }
    }

    async function checkForUpdates() {
      if (state.refreshing) return;
      try {
        const status = await fetchRevision();
        if (state.revision && status.revision !== state.revision) await loadGraph(status.revision);
        else if (!state.revision) state.revision = status.revision;
      } catch (error) {
        console.warn('Graph refresh check failed:', error);
      }
    }

    function showToast(message) {
      el.toast.textContent = message;
      el.toast.hidden = false;
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => { el.toast.hidden = true; }, 4200);
    }

    async function rebuildTaxonomy() {
      if (el.rebuildTaxonomy.disabled) return;
      el.rebuildTaxonomy.disabled = true;
      el.rebuildTaxonomy.setAttribute('aria-busy', 'true');
      showToast('正在执行全局分类重组...');
      try {
        const response = await fetch('/api/taxonomy/rebuild', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);
        await loadGraph(result.revision);
        showToast(`分类重组完成：${result.active_categories ?? result.categories ?? 0} 个有效类别`);
      } catch (error) {
        showToast(`分类重组失败：${error?.message || String(error)}`);
      } finally {
        el.rebuildTaxonomy.disabled = false;
        el.rebuildTaxonomy.removeAttribute('aria-busy');
      }
    }

    async function start() {
      try {
        if (typeof cytoscape !== 'function') throw new Error('Cytoscape 本地资源加载失败，请重新运行 scripts/vendor_web_assets.sh');
        if (typeof cytoscapeFcose === 'function') cytoscape.use(cytoscapeFcose);
        const status = await fetchRevision();
        await loadGraph(status.revision);
      } catch (error) {
        console.error('Graph initialization failed:', error);
        el.loading.hidden = true; el.errorText.textContent = error?.message || String(error); el.errorState.hidden = false;
      }
    }

    el.search.addEventListener('input', () => renderSearchResults(el.search.value));
    el.search.addEventListener('keydown', (event) => { if (event.key === 'Escape') { el.search.value = ''; renderSearchResults(''); } });
    el.fitButton.addEventListener('click', () => state.cy?.fit(state.cy.elements().not('.filtered'), 42));
    el.layoutButton.addEventListener('click', () => runLayout(true));
    el.modeSwitch.addEventListener('click', (event) => {
      const button = event.target.closest('[data-mode]');
      if (button && button.dataset.mode !== state.mode) replaceGraphElements(button.dataset.mode);
    });
    el.rebuildTaxonomy.addEventListener('click', rebuildTaxonomy);
    el.labelsToggle.addEventListener('change', () => { state.showAllLabels = el.labelsToggle.checked; updateLabels(); persistGraphState(); notifyGraphContext(); });
    el.neighborOnly.addEventListener('change', applyFilters);
    el.filterButton.addEventListener('click', () => document.body.classList.add('filters-open'));
    el.closeFilters.addEventListener('click', () => document.body.classList.remove('filters-open'));
    el.closeDetails.addEventListener('click', () => document.body.classList.remove('details-open'));
    el.mobileScrim.addEventListener('click', closePanels);
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') { closePanels(); el.searchResults.hidden = true; } });
    window.addEventListener('message', (event) => {
      if (event.origin !== WORKBENCH_ORIGIN) return;
      if (event.data?.type === 'kb-refresh') fetchRevision().then((status) => loadGraph(status.revision)).catch((error) => console.warn('Workbench graph refresh failed:', error));
    });
    start();
    setInterval(checkForUpdates, 4000);
  </script>
</body>
</html>
