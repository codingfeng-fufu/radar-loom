<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识地图 · RadarLoom</title><link rel="stylesheet" href="assets/ui-tokens.css"><link rel="stylesheet" href="assets/ui-states.css"><style>body{margin:0;background:#f5f7fb;color:#17233d;font:14px/1.6 system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0}.top{display:flex;gap:14px;align-items:center;margin-bottom:20px}.top a{color:#147d73}.top h1{margin:0}.muted{color:#68758a;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{padding:16px;border:1px solid #dce3ec;border-radius:12px;background:#fff;box-shadow:0 8px 24px #15284810}.card h2{margin:0 0 5px;font-size:17px}.card p{margin:6px 0;color:#68758a}.card ul{padding-left:20px}.card a{color:#147d73}.weak{border-left:3px solid #d2a33a}.empty{color:#68758a}@media(max-width:700px){.top{flex-wrap:wrap}.muted{width:100%;margin-left:0}}</style></head><body><main class="wrap"><header class="top"><a href="viewer.html">← 返回 Viewer</a><h1>知识地图</h1><span class="muted" id="meta">读取社区数据…</span></header><section id="map" class="grid"><div class="rl-state rl-state-loading">正在读取社区摘要</div></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const page=n=>`<a href="viewer.html?section=knowledge&f=${encodeURIComponent('pages/'+n+'.md')}">${esc(n)}</a>`;async function start(){try{const data=await (await fetch('community-data.json',{cache:'no-store'})).json();const byId=new Map((data.communities||[]).map(x=>[x.id,x]));document.querySelector('#meta').textContent=`${data.stats?.communities||0} 个社区 · ${data.stats?.pages||0} 个页面 · 生成于 ${data.generatedAt||'未记录'}`;const weak=(data.edges||[]).filter(x=>Number(x.count||0)<=1);const cards=(data.communities||[]).filter(x=>x.level===1||!x.parent).map(item=>{const members=(item.members||[]).slice(0,5);return `<article class="card"><h2>${esc(item.name||item.id)}</h2><p>${esc(item.summary||item.detail||'暂无社区摘要')}</p><p>成员 ${item.memberCount||0} · 内部边 ${item.internalEdgeCount||0} · 层级 ${item.level||1}</p><h3>代表页面</h3><ul>${members.map(page).map(x=>`<li>${x}</li>`).join('')||'<li class="empty">暂无成员</li>'}</ul><a href="graph-view.html?profile=knowledge&mode=community">在社区图谱中下钻 →</a></article>`}).join('');const weakCard=weak.length?`<article class="card weak"><h2>社区弱连接 (${weak.length})</h2>${weak.slice(0,20).map(edge=>`<p>${esc(byId.get(edge.source)?.name||edge.source)} ↔ ${esc(byId.get(edge.target)?.name||edge.target)} · ${edge.count} 条引用</p>`).join('')}</article>`:'';document.querySelector('#map').innerHTML=cards+weakCard||'<p class="empty">暂无社区数据。</p>'}catch(error){document.querySelector('#map').innerHTML=`<div class="rl-state rl-state-error"><strong class="rl-state-title">知识地图读取失败</strong><span class="rl-state-detail">${esc(error.message)}</span><button class="rl-state-action" onclick="start()">重试</button></div>`}}start();</script></body></html>
