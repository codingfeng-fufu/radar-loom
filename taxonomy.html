<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识整理 · RadarLoom</title><link rel="stylesheet" href="assets/ui-tokens.css"><link rel="stylesheet" href="assets/ui-states.css"><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--rl-bg,#f5f7fb);color:var(--rl-text,#17233d);font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 64px}.top{display:flex;align-items:center;gap:14px;margin-bottom:24px}.top a{color:var(--rl-accent,#147d73);text-decoration:none}.top h1{margin:0;font-size:26px}.top .muted{color:var(--rl-muted,#68758a);margin-left:auto}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:22px}.stat,.card{border:1px solid var(--rl-border,#dce3ec);border-radius:12px;background:#fff;box-shadow:0 8px 24px rgb(21 40 72 / 6%)}.stat{padding:14px}.stat strong{display:block;font-size:25px}.stat span{color:var(--rl-muted,#68758a);font-size:12px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{padding:18px;margin-bottom:16px}.card h2{margin:0 0 12px;font-size:17px}.list{display:grid;gap:8px}.row{border:1px solid #e4e9ef;border-radius:9px;padding:10px;background:#fbfcfd;cursor:pointer}.row:hover{border-color:#147d73;background:#effaf8}.row strong{display:block}.meta{color:#68758a;font-size:12px}.badge{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:#e8f3f0;color:#147d73;font-size:11px}.candidate{border-left:3px solid #d2a33a}.event{border-left:3px solid #8ba0b8}.detail{min-height:160px}.detail a{color:#147d73}.detail ul{padding-left:20px}.empty{color:#68758a}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-wrap:wrap}.top .muted{margin-left:0;width:100%}}
</style></head><body><main class="wrap"><header class="top"><a href="viewer.html">← 返回 Viewer</a><h1>知识整理</h1><span class="muted" id="runLabel">读取分类状态…</span></header><section class="stats" id="stats"><div class="stat rl-state rl-state-loading"><span>正在读取分类数据</span></div></section><div class="grid"><section><div class="card"><h2>候选类别 <span class="meta">自动发现，尚未稳定</span></h2><div class="list" id="candidates"></div></div><div class="card"><h2>自动类别</h2><div class="list" id="categories"></div></div></section><aside><div class="card detail" id="detail"><h2>类别详情</h2><p class="empty">点击候选或类别，查看成员、形成原因和代表页面。</p></div><div class="card"><h2>最近分类变化</h2><div class="list" id="events"></div></div></aside></div></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkPage=name=>`<a href="viewer.html?section=knowledge&f=${encodeURIComponent('pages/'+name+'.md')}">${esc(name)}</a>`;
function renderDetail(item,isCandidate){const members=item.members||[];const detail=document.querySelector('#detail');detail.innerHTML=`<h2>${esc(item.name||item.label||item.id)} <span class="badge">${isCandidate?'候选':'自动类别'}</span></h2><p>${esc(item.definition||item.reason||'系统根据语义、显式引用和历史分类信号形成。')}</p><p class="meta">状态：${esc(item.status||'形成中')} · 更新时间：${esc(item.updatedAt||item.lastConfirmedAt||'未记录')}</p>${members.length?`<h3>成员页面 (${members.length})</h3><ul>${members.map(linkPage).map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="empty">暂未形成成员列表。</p>'}${item.related_category_ids?.length?`<p class="meta">相关类别：${item.related_category_ids.map(esc).join('、')}</p>`:''}<p><a href="graph-view.html?profile=knowledge&mode=taxonomy">在分类图谱中查看 →</a></p>`}
async function start(){try{const response=await fetch('graph-data.json',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();const t=data.taxonomy||{};const s=t.stats||{};const values=[['活跃类别',s.activeCategories||0],['自动类别',s.automaticCategories||0],['形成中',s.forming||0],['候选类别',s.candidates||0],['待处理页面',s.pendingPages||0]];document.querySelector('#stats').innerHTML=values.map(([label,value])=>`<div class="stat"><strong>${esc(value)}</strong><span>${label}</span></div>`).join('');const run=t.lastRun||{};document.querySelector('#runLabel').textContent=`上次运行：${run.finishedAt||run.startedAt||t.generatedAt||'未记录'} · ${run.outcome||run.status||'未知'}`;const candidates=t.candidates||[];document.querySelector('#candidates').innerHTML=candidates.length?candidates.map(item=>`<div class="row candidate" data-kind="candidate" data-id="${esc(item.id)}"><strong>${esc(item.name||item.label||item.id)}</strong><span class="meta">${(item.members||[]).length} 个成员 · ${esc(item.status||'形成中')} · ${esc(item.reason||'自动发现候选')}</span></div>`).join(''):'<p class="empty">当前没有待观察候选类别。</p>';const cats=(t.categories||[]).filter(x=>x.source==='automatic'&&x.status!=='merged');document.querySelector('#categories').innerHTML=cats.length?cats.map(item=>`<div class="row" data-kind="category" data-id="${esc(item.id)}"><strong>${esc(item.name)} <span class="badge">${esc(item.status)}</span></strong><span class="meta">${esc(item.definition||'自动生成类别')}</span></div>`).join(''):'<p class="empty">尚未形成自动类别。</p>';const events=(t.events||[]).slice(-12).reverse();document.querySelector('#events').innerHTML=events.length?events.map(item=>`<div class="row event"><strong>${esc(item.type)} · ${esc(item.categoryIds?.join('、'))}</strong><span class="meta">${esc(item.createdAt)} · ${esc(item.reason)}</span></div>`).join(''):'<p class="empty">暂无分类变化记录。</p>';const all=[...candidates.map(x=>[x,true]),...cats.map(x=>[x,false])];document.querySelectorAll('.row[data-id]').forEach(row=>row.addEventListener('click',()=>{const found=all.find(([x])=>x.id===row.dataset.id);if(found)renderDetail(found[0],found[1])}));}catch(error){document.querySelector('#stats').innerHTML=`<div class="rl-state rl-state-error"><strong class="rl-state-title">分类数据读取失败</strong><span class="rl-state-detail">${esc(error.message)}</span><button class="rl-state-action" onclick="start()">重试</button></div>`}}start();
</script></body></html>
