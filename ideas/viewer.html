<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idea Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23202421'/%3E%3Cpath d='M9 17h6M10 20h4M8.5 13.5a6 6 0 1 1 7 0c-.8.6-1.3 1.4-1.5 2.5h-4c-.2-1.1-.7-1.9-1.5-2.5Z' fill='none' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E">
  <script src="../vendor/marked/marked.min.js"></script>
  <script src="../vendor/dompurify/purify.min.js"></script>
  <style>
    :root{color-scheme:light;--bg:#f7f8f7;--surface:#fff;--soft:#eef1ef;--ink:#202421;--muted:#68716c;--line:#d9dfdb;--accent:#087f68;--accent-soft:#e5f3ef;--amber:#9a6700;--amber-soft:#fff6dc;--blue:#315b7d;--blue-soft:#eaf1f6;--danger:#a33b2b}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}body,button,input,textarea{font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}button{color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .app{display:grid;grid-template-rows:52px minmax(0,1fr);height:100vh}.topbar{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:0 18px;background:var(--surface)}.brand{display:flex;align-items:center;gap:10px;min-width:220px;font-size:16px;font-weight:700}.brand-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--ink);color:#fff}.brand-mark svg,.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.workspace-switch{display:flex;height:32px;border:1px solid var(--line);border-radius:5px;overflow:hidden}.workspace-switch button{border:0;border-right:1px solid var(--line);padding:0 12px;background:var(--surface);color:var(--muted);cursor:pointer}.workspace-switch button:last-child{border-right:0}.workspace-switch .active{background:var(--soft);color:var(--ink);font-weight:650}.top-spacer{flex:1}.search{width:min(28vw,320px);height:34px;border:1px solid var(--line);border-radius:5px;padding:0 11px;background:var(--bg)}.primary{height:34px;border:0;border-radius:5px;padding:0 13px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}
    .layout{display:grid;grid-template-columns:264px minmax(520px,1fr) 328px;min-height:0}.rail{min-height:0;overflow:auto;background:var(--soft);border-right:1px solid var(--line);padding:18px 12px}.rail-title{display:flex;align-items:center;justify-content:space-between;margin:0 8px 12px;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}.nav{display:grid;gap:2px}.nav button{display:flex;align-items:center;gap:9px;width:100%;height:36px;border:0;border-radius:5px;padding:0 9px;background:transparent;text-align:left;cursor:pointer}.nav button:hover,.nav button.active{background:var(--surface)}.nav .count{margin-left:auto;color:var(--muted);font-size:12px}.icon{display:grid;place-items:center;width:18px;height:18px;color:var(--muted)}.divider-label{margin:22px 8px 8px;color:var(--muted);font-size:12px;font-weight:700}.idea-list{display:grid;gap:4px}.idea-row{width:100%;border:0;border-radius:5px;padding:9px;background:transparent;text-align:left;cursor:pointer}.idea-row:hover,.idea-row.active{background:var(--surface)}.idea-row strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.idea-meta{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--muted);font-size:11px}.dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}.dot.green{background:var(--accent)}.dot.gray{background:#89928c}
    .document{min-width:0;overflow:auto;background:var(--surface)}.doc-inner{width:min(760px,calc(100% - 64px));margin:0 auto;padding:42px 0 90px}.eyebrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.status-pill{border-radius:999px;padding:2px 8px;background:var(--amber-soft);color:var(--amber);font-weight:650}.doc-title{margin:12px 0 8px;font-size:29px;line-height:1.25}.lead{margin:0 0 26px;color:#4d5751;font-size:16px;line-height:1.7}.facts{display:grid;grid-template-columns:110px 1fr;gap:7px 12px;margin:0 0 30px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.facts dt{color:var(--muted)}.facts dd{margin:0}.tag{display:inline-block;margin-right:5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--bg);font-size:12px}.section{margin-top:30px}.section h2{margin:0 0 11px;font-size:18px}.section p{margin:0 0 10px;line-height:1.75}.notice{border-left:3px solid var(--amber);padding:10px 13px;background:var(--amber-soft)}.notice strong{display:block;margin-bottom:3px}.attempt{margin-top:12px;border-top:1px solid var(--line);padding-top:16px}.attempt-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px}.attempt-head strong{font-size:15px}.attempt-head time{color:var(--muted);font-size:12px}.attempt-grid{display:grid;grid-template-columns:96px 1fr;gap:6px 12px}.attempt-grid span:nth-child(odd){color:var(--muted)}.link-button{margin-top:13px;border:0;padding:0;background:transparent;color:var(--accent);font-weight:650;cursor:pointer}
    .context{min-height:0;overflow:auto;border-left:1px solid var(--line);background:var(--bg);padding:20px 16px}.context h2{margin:0 0 5px;font-size:15px}.context-intro{margin:0 0 18px;color:var(--muted);font-size:12px}.context-section{margin-bottom:24px}.candidate{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:13px}.candidate+.candidate{margin-top:8px}.candidate-id{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.candidate h3{margin:4px 0 7px;font-size:14px;line-height:1.35}.reason{margin:0;color:var(--muted);font-size:12px}.match{display:flex;align-items:center;gap:7px;margin-top:10px;color:var(--accent);font-size:12px;font-weight:650}.match-bar{flex:1;height:3px;background:var(--soft)}.match-bar i{display:block;width:82%;height:100%;background:var(--accent)}.candidate-actions{display:flex;gap:7px;margin-top:12px}.secondary,.quiet{height:30px;border:1px solid var(--line);border-radius:4px;padding:0 9px;background:var(--surface);font-size:12px;cursor:pointer}.secondary{border-color:var(--accent);color:var(--accent)}.quiet{color:var(--muted)}.blocker-list{margin:8px 0 0;padding:0;list-style:none}.blocker-list li{position:relative;margin:7px 0;padding-left:15px;font-size:12px}.blocker-list li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--amber)}
    dialog{width:min(560px,calc(100vw - 40px));border:1px solid var(--line);border-radius:7px;padding:0;background:var(--surface);box-shadow:0 20px 60px rgb(0 0 0 / 20%)}dialog::backdrop{background:rgb(32 36 33 / 36%)}.modal-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:14px 18px}.modal-head h2{margin:0;font-size:16px}.close{width:30px;height:30px;border:0;background:transparent;font-size:20px;cursor:pointer}.modal-body{padding:18px}.field{display:grid;gap:6px;margin-bottom:15px}.field label{font-weight:650}.field small{color:var(--muted)}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:5px;padding:9px 10px;background:var(--bg)}.field textarea{min-height:92px;resize:vertical}.modal-foot{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding:12px 18px}.toast{position:fixed;right:24px;bottom:22px;z-index:20;border:1px solid var(--line);border-radius:6px;padding:10px 13px;background:var(--ink);color:#fff;box-shadow:0 10px 30px rgb(0 0 0 / 16%);opacity:0;transform:translateY(8px);pointer-events:none;transition:160ms}.toast.show{opacity:1;transform:none}
    .idea-body h1{display:none}.idea-body h2{margin:30px 0 11px;font-size:18px}.idea-body h3{margin:20px 0 8px;font-size:15px}.idea-body p,.idea-body li{line-height:1.75}.idea-body blockquote{margin-left:0;border-left:3px solid var(--line);padding-left:12px;color:var(--muted)}.empty{display:grid;place-items:center;min-height:55vh;text-align:center;color:var(--muted)}.empty strong{display:block;margin-bottom:7px;color:var(--ink);font-size:19px}.loading{padding:12px;color:var(--muted)}
    @media(max-width:1050px){.layout{grid-template-columns:230px minmax(480px,1fr)}.context{display:none}.search{display:none}}
    :root{--bg:#f5f7fb;--surface:#fff;--soft:#eef3f8;--ink:#17233d;--muted:#718096;--line:#dbe3ec;--accent:#147d73;--accent-soft:#e2f5f1;--amber:#a66a08;--amber-soft:#fff6dd}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .topbar{height:60px;padding:0 22px;background:rgb(255 255 255 / 94%);box-shadow:0 4px 18px rgb(19 42 73 / 6%)}
    .brand{font-size:17px;color:#152850}.brand-mark{width:30px;height:30px;border-radius:9px;background:#152850}
    .workspace-switch{height:36px;padding:3px;gap:2px;border:0;border-radius:10px;background:#e7edf4;overflow:visible}.workspace-switch button{border:0!important;border-radius:8px;padding:0 13px}.workspace-switch button:hover{background:rgb(255 255 255 / 72%)}.workspace-switch .active{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgb(23 35 61 / 9%)}
    .primary{height:36px;border-radius:9px;box-shadow:0 5px 14px rgb(20 125 115 / 18%);transition:.18s}.primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgb(20 125 115 / 24%)}
    .search{height:36px;border-color:#d4deea;border-radius:9px;background:#f8fafc}.layout{grid-template-columns:276px minmax(560px,1fr) 344px}.rail{padding:22px 14px;background:linear-gradient(180deg,#f5fafb 0%,#eef3f8 100%);border-right-color:#dbe3ec}.nav button,.idea-row{height:38px;border-radius:9px}.nav button:hover,.nav button.active,.idea-row:hover,.idea-row.active{background:#fff;box-shadow:0 3px 10px rgb(21 40 72 / 5%)}.divider-label{margin-top:25px;color:#718096;letter-spacing:.06em}
    .document{background:#fff}.doc-inner{width:min(800px,calc(100% - 76px));padding:52px 0 100px}.doc-title{font-size:34px;line-height:1.18;color:#152850}.lead{font-size:17px;color:#4c5f77}.facts{padding:16px 0;border-color:#dbe3ec}.tag{background:#f8fafc;border-color:#dbe3ec}.section h2{font-size:20px;color:#1a376a}.notice{border-radius:0 10px 10px 0;background:#fff8e8}.attempt{padding-top:20px;border-color:#dbe3ec}
    .context{padding:22px 18px;background:#f5f7fb;border-left-color:#dbe3ec}.candidate{border-color:#dbe3ec;border-radius:10px;box-shadow:0 6px 18px rgb(21 40 72 / 5%)}.secondary,.quiet{border-radius:8px}.toast{border-radius:10px;box-shadow:0 12px 30px rgb(21 40 72 / 20%)}
    @media(max-width:760px){.app{grid-template-rows:56px minmax(0,1fr)}.topbar{gap:8px;padding:0 12px;overflow-x:auto}.brand{min-width:max-content}.workspace-switch{flex:0 0 auto}.workspace-switch button{padding:0 9px}.layout{display:block;position:relative;overflow:hidden}.rail{display:none}.document{width:100%;min-height:0}.doc-inner{width:calc(100% - 32px);padding:30px 0 72px}.doc-title{font-size:28px}.context{display:none}.facts{grid-template-columns:92px 1fr}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M8.5 14.5A7 7 0 1 1 15.5 14.5c-.8.6-1.3 1.4-1.5 2.5h-4c-.2-1.1-.7-1.9-1.5-2.5Z"/></svg></span>Idea Lab</div>
      <div class="workspace-switch" aria-label="工作区"><button id="openKnowledge">知识库</button><button id="openInterview">工程面试</button><button class="active">Ideas</button><button id="openGraph">图谱</button></div>
      <div class="top-spacer"></div>
      <input class="search" type="search" placeholder="搜索 Idea、问题或阻塞点">
      <button class="primary" id="newIdea">＋ 记录 Idea</button>
    </header>
    <div class="layout">
      <aside class="rail">
        <div class="rail-title"><span>工作视图</span><span id="totalIdeas">0</span></div>
        <nav class="nav">
          <button class="active" data-filter="all"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></svg></span>全部 Idea<span class="count" id="allCount">0</span></button>
          <button data-filter="recent"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg></span>最近记录<span class="count" id="recentCount">0</span></button>
          <button data-filter="blocked"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.6 2.5 17a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/></svg></span>被阻塞<span class="count" id="blockedCount">0</span></button>
          <button data-filter="combined"><span class="icon"><svg viewBox="0 0 24 24"><path d="M8 12h8M12 8v8M4 6h16v14H4zM8 2v4M16 2v4"/></svg></span>组合关系<span class="count" id="combinedCount">0</span></button>
          <button data-filter="dormant"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 9h8M8 13h5"/></svg></span>休眠中<span class="count" id="dormantCount">0</span></button>
        </nav>
        <div class="divider-label">最近更新</div>
        <div class="idea-list" id="ideaList"><div class="loading">正在读取...</div></div>
      </aside>
      <main class="document">
        <article class="doc-inner" id="ideaDocument"><div class="loading">正在载入 Idea...</div></article>
      </main>
      <aside class="context" id="contextPanel"><div class="loading">选择 Idea 后显示关系</div></aside>
    </div>
  </div>
  <dialog id="captureDialog">
    <form method="dialog">
      <div class="modal-head"><h2>快速记录 Idea</h2><button class="close" value="cancel" aria-label="关闭">×</button></div>
      <div class="modal-body"><div class="field"><label for="ideaText">一句话 Idea</label><textarea id="ideaText" placeholder="先保留你的原始表达，不需要整理完整。"></textarea></div><div class="field"><label for="problemText">想解决的问题</label><input id="problemText" placeholder="这个想法是被什么问题触发的？"><small>可以暂时留空，稍后再由 Claude 帮你整理。</small></div></div>
      <div class="modal-foot"><button class="quiet" value="cancel">取消</button><button class="primary" id="saveIdea" value="default">保存到收件箱</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const dialog=document.getElementById('captureDialog');const toast=document.getElementById('toast');
    const ideaList=document.getElementById('ideaList');const ideaDocument=document.getElementById('ideaDocument');const contextPanel=document.getElementById('contextPanel');
    const statusColors={blocked:'',exploring:'green',validated:'green',captured:'gray',attempted:'gray',dormant:'gray',abandoned:'gray'};
    let entries=[];let activeId='';let activeFilter='all';
    const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    function showToast(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2600)}
    function filteredEntries(){const query=document.querySelector('.search').value.trim().toLowerCase();return entries.filter(entry=>{const matchesFilter=activeFilter==='all'||(activeFilter==='recent')||entry.status===activeFilter||(activeFilter==='combined'&&(entry.derived_from.length||entry.combined_into.length));const haystack=[entry.id,entry.title,entry.problem,...entry.domains,...entry.blockers].join(' ').toLowerCase();return matchesFilter&&(!query||haystack.includes(query))}).slice(0,activeFilter==='recent'?10:entries.length)}
    function renderList(){const selected=filteredEntries();ideaList.innerHTML=selected.map(entry=>`<button class="idea-row ${entry.id===activeId?'active':''}" data-id="${escapeHtml(entry.id)}"><strong>${escapeHtml(entry.title)}</strong><span class="idea-meta"><i class="dot ${statusColors[entry.status]||''}"></i>${escapeHtml(entry.status_label)} · ${escapeHtml(entry.updated)}</span></button>`).join('')||'<div class="loading">没有符合条件的 Idea</div>';ideaList.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>selectIdea(button.dataset.id)))}
    function candidateScore(source,target){let score=0;const reasons=[];if(source.problem&&target.problem&&source.problem===target.problem){score+=4;reasons.push('解决同一个问题')}const shared=source.domains.filter(item=>target.domains.includes(item));if(shared.length){score+=shared.length;reasons.push(`共同领域：${shared.join('、')}`)}for(const blocker of target.blockers){if(source.summary.includes(blocker)||source.title.includes(blocker)){score+=3;reasons.push(`可能补全阻塞点“${blocker}”`)}}return{score,reasons}}
    function requestClaude(action,ideaId,relatedId=''){if(window.parent===window){showToast('请从 18080 操作台打开 Idea Lab 后使用 Claude');return}showToast(action==='organize'?'将交给 Claude 整理当前 Idea；不会修改主知识库':'已准备 Idea Lab 任务；发送前请检查右侧草稿');window.parent.postMessage({type:'idea-claude-request',version:1,action,ideaId,relatedId},'http://127.0.0.1:18080')}
    function renderContext(entry){const candidates=entries.filter(item=>item.id!==entry.id).map(item=>({item,...candidateScore(entry,item)})).filter(item=>item.score>0).sort((a,b)=>b.score-a.score).slice(0,3);const cards=candidates.map(candidate=>`<div class="candidate"><span class="candidate-id">${escapeHtml(candidate.item.id)}</span><h3>${escapeHtml(candidate.item.title)}</h3><p class="reason">${escapeHtml(candidate.reasons.join('；'))}</p><div class="candidate-actions"><button class="secondary" data-combine="${escapeHtml(candidate.item.id)}">交给 Claude 组合</button><button class="quiet" data-view="${escapeHtml(candidate.item.id)}">查看</button></div></div>`).join('')||'<p class="context-intro">暂未发现有明确理由的组合候选。</p>';contextPanel.innerHTML=`<section class="context-section"><h2>可能的组合</h2><p class="context-intro">候选只提供线索，不自动合并。</p>${cards}</section><section class="context-section"><h2>当前阻塞点</h2><ul class="blocker-list">${entry.blockers.map(item=>`<li>${escapeHtml(item)}</li>`).join('')||'<li>尚未记录明确阻塞点</li>'}</ul></section><section class="context-section"><h2>外部引用</h2>${entry.external_refs.map(item=>`<div class="candidate"><h3>${escapeHtml(item)}</h3><p class="reason">外部引用不计入 Idea 核心统计。</p></div>`).join('')||'<p class="context-intro">暂无外部引用。</p>'}</section>`;contextPanel.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>selectIdea(button.dataset.view)));contextPanel.querySelectorAll('[data-combine]').forEach(button=>button.addEventListener('click',()=>requestClaude('combine',entry.id,button.dataset.combine)))}
    async function selectIdea(id){const entry=entries.find(item=>item.id===id);if(!entry)return;activeId=id;renderList();ideaDocument.innerHTML='<div class="loading">正在读取页面...</div>';try{const response=await fetch(entry.file,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const source=await response.text();const body=source.replace(/^---\n[\s\S]*?\n---\n/,'');const html=DOMPurify.sanitize(marked.parse(body));ideaDocument.innerHTML=`<div class="eyebrow"><span>${escapeHtml(entry.id)}</span><span>·</span><span class="status-pill">${escapeHtml(entry.status_label)}</span><span>更新于 ${escapeHtml(entry.updated)}</span></div><h1 class="doc-title">${escapeHtml(entry.title)}</h1>${entry.problem?`<p class="lead">${escapeHtml(entry.problem)}</p>`:''}<dl class="facts"><dt>当前状态</dt><dd>${escapeHtml(entry.status_label)}</dd><dt>涉及领域</dt><dd>${entry.domains.map(item=>`<span class="tag">${escapeHtml(item)}</span>`).join('')||'未分类'}</dd><dt>重新启动条件</dt><dd>${entry.restart_when.map(escapeHtml).join('；')||'尚未记录'}</dd></dl><div class="idea-body">${html}</div><div class="candidate-actions"><button class="secondary" id="organizeIdea">交给 Claude 整理</button><button class="link-button" id="addAttempt">＋ 记录新的尝试</button></div>`;document.getElementById('organizeIdea').addEventListener('click',()=>requestClaude('organize',entry.id));document.getElementById('addAttempt').addEventListener('click',()=>requestClaude('attempt',entry.id));renderContext(entry);history.replaceState(null,'',`?id=${encodeURIComponent(id)}`)}catch(error){ideaDocument.innerHTML=`<div class="empty"><div><strong>页面载入失败</strong>${escapeHtml(error.message)}</div></div>`}}
    async function loadIndex(preferredId){try{const response=await fetch('data/idea-index.json',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const payload=await response.json();entries=Array.isArray(payload.entries)?payload.entries:[];document.getElementById('totalIdeas').textContent=entries.length;document.getElementById('allCount').textContent=entries.length;document.getElementById('recentCount').textContent=Math.min(10,entries.length);document.getElementById('blockedCount').textContent=entries.filter(item=>item.status==='blocked').length;document.getElementById('dormantCount').textContent=entries.filter(item=>item.status==='dormant').length;document.getElementById('combinedCount').textContent=entries.filter(item=>item.derived_from.length||item.combined_into.length).length;if(!entries.length){renderList();ideaDocument.innerHTML='<div class="empty"><div><strong>还没有 Idea</strong>点击右上角“记录 Idea”，先保存第一条原始灵感。</div></div>';contextPanel.innerHTML='<div class="loading">第一条 Idea 创建后显示关系</div>';return true}await selectIdea(entries.some(item=>item.id===preferredId)?preferredId:entries[0].id);return true}catch(error){ideaList.innerHTML='<div class="loading">索引不可用</div>';ideaDocument.innerHTML=`<div class="empty"><div><strong>Idea 索引载入失败</strong>${escapeHtml(error.message)}<br>运行 build_idea_index.py 后重试。</div></div>`;return false}}
    document.getElementById('newIdea').addEventListener('click',()=>dialog.showModal());
    document.getElementById('saveIdea').addEventListener('click',async event=>{event.preventDefault();const idea=document.getElementById('ideaText').value.trim();const problem=document.getElementById('problemText').value.trim();if(!idea){showToast('请先写下一句话 Idea');return}event.currentTarget.disabled=true;try{const response=await fetch('/api/ideas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea,problem,domains:[]})});const payload=await response.json();if(!response.ok||!payload.ok)throw new Error(payload.error||`HTTP ${response.status}`);dialog.close();document.getElementById('ideaText').value='';document.getElementById('problemText').value='';showToast('Idea 已保存');await loadIndex()}catch(error){showToast(`保存失败：${error.message}`)}finally{event.currentTarget.disabled=false}});
    document.querySelectorAll('.nav [data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.nav [data-filter]').forEach(item=>item.classList.remove('active'));button.classList.add('active');activeFilter=button.dataset.filter;renderList()}));
    document.querySelector('.search').addEventListener('input',renderList);
    document.getElementById('openKnowledge').addEventListener('click',()=>location.href='../viewer.html');
    document.getElementById('openInterview').addEventListener('click',()=>location.href='../viewer.html?section=interview');
    document.getElementById('openGraph').addEventListener('click',()=>location.href='graph-view.html');
    window.addEventListener('message',event=>{if(event.origin!=='http://127.0.0.1:18080'||event.source!==window.parent||event.data?.type!=='idea-claude-result')return;showToast(event.data.ok?'已放入 Claude 输入框，请补充后发送':`Claude 交接失败：${event.data.error||'未知错误'}`)});
    window.addEventListener('message',async event=>{if(event.origin!=='http://127.0.0.1:18080'||event.source!==window.parent||event.data?.type!=='kb-refresh')return;const ok=await loadIndex(activeId);window.parent.postMessage({type:'kb-refresh-result',ok,surface:'viewer',error:ok?null:'Idea 索引重新载入失败'},'http://127.0.0.1:18080')});
    loadIndex(new URLSearchParams(location.search).get('id'));
  </script>
</body>
</html>
