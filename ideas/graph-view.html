<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Idea Lab 图谱</title>
  <script src="../vendor/cytoscape/cytoscape.min.js"></script>
  <style>
    :root{--bg:#f7f8f7;--surface:#fff;--ink:#202421;--muted:#68716c;--line:#d9dfdb;--accent:#087f68;--amber:#b77900;--blue:#315b7d}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body,button,input{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);letter-spacing:0}.app{display:grid;grid-template-rows:52px minmax(0,1fr);height:100%}.top{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:0 16px;background:var(--surface)}.top strong{font-size:16px}.top a{color:var(--accent);text-decoration:none}.top span{color:var(--muted)}.spacer{flex:1}.top input{width:280px;height:34px;border:1px solid var(--line);border-radius:5px;padding:0 10px;background:var(--bg)}.icon{width:34px;height:34px;border:1px solid var(--line);border-radius:5px;background:var(--surface);cursor:pointer}.body{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}.canvas{position:relative;min-width:0;background:var(--bg)}#cy{position:absolute;inset:0}.legend{position:absolute;left:16px;bottom:16px;display:flex;gap:14px;border:1px solid var(--line);border-radius:5px;padding:7px 10px;background:rgb(255 255 255 / 92%);color:var(--muted);font-size:12px}.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:50%;background:var(--accent)}.legend .problem{border-radius:2px;background:var(--blue)}.legend .blocker{border-radius:2px;transform:rotate(45deg);background:var(--amber)}.panel{overflow:auto;border-left:1px solid var(--line);padding:20px;background:var(--surface)}.panel h1{margin:0 0 5px;font-size:17px}.panel p{color:var(--muted)}.facts{display:grid;grid-template-columns:72px 1fr;gap:7px 10px;margin-top:18px}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}.open{display:inline-block;margin-top:18px;border:1px solid var(--accent);border-radius:4px;padding:6px 9px;color:var(--accent);text-decoration:none}.empty{display:grid;place-items:center;height:100%;color:var(--muted)}@media(max-width:850px){.body{grid-template-columns:1fr}.panel{display:none}.top input{width:180px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><strong>Idea Lab</strong><span>/ 图谱</span><a href="viewer.html">返回列表</a><div class="spacer"></div><input id="search" type="search" placeholder="搜索 Idea、问题或阻塞点"><button class="icon" id="fit" title="适应画布" aria-label="适应画布">⌗</button></header>
    <div class="body"><main class="canvas"><div id="cy"></div><div class="legend"><span><i></i>Idea</span><span><i class="problem"></i>问题</span><span><i class="blocker"></i>阻塞点</span></div></main><aside class="panel" id="panel"><h1>Idea 图谱</h1><p>选择节点查看关系。核心统计只计算 Idea 节点。</p></aside></div>
  </div>
  <script>
    let cy;const panel=document.getElementById('panel');
    const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    async function start(){try{const response=await fetch('data/idea-graph-data.json',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();if(cy){cy.destroy();cy=null}if(!data.nodes.length){document.getElementById('cy').innerHTML='<div class="empty">创建第一条 Idea 后，关系图谱会在这里出现。</div>';return true}data.nodes.forEach(node=>{const label=String(node.data.label||'');node.data.shortLabel=label.length>14?label.slice(0,14)+'…':label});cy=cytoscape({container:document.getElementById('cy'),elements:[...data.nodes,...data.edges],style:[{selector:'node',style:{'background-color':'#087f68','label':'data(shortLabel)','font-size':9,'text-wrap':'wrap','text-max-width':86,'text-valign':'bottom','text-margin-y':6,'width':30,'height':30,'border-width':2,'border-color':'#fff'}},{selector:'node[type="problem"]',style:{'shape':'round-rectangle','background-color':'#315b7d','width':25,'height':25}},{selector:'node[type="blocker"]',style:{'shape':'diamond','background-color':'#b77900','width':23,'height':23}},{selector:'node[status="blocked"]',style:{'background-color':'#b77900'}},{selector:'node[status="dormant"],node[status="abandoned"]',style:{'background-color':'#89928c'}},{selector:'edge',style:{'width':1.2,'line-color':'#b8c1bc','target-arrow-color':'#b8c1bc','target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':.7}},{selector:':selected',style:{'border-color':'#202421','border-width':3}},{selector:'.faded',style:{'opacity':.12}}],layout:{name:'cose',animate:false,padding:60,nodeRepulsion:9000,idealEdgeLength:100}});cy.on('tap','node',event=>renderNode(event.target));document.getElementById('fit').onclick=()=>cy.fit(undefined,50);document.getElementById('search').oninput=event=>filter(event.target.value);panel.innerHTML=`<h1>Idea 图谱</h1><p>${data.stats.ideas} 条 Idea · ${data.stats.nodes} 个节点 · ${data.stats.edges} 条边</p>`;return true}catch(error){document.getElementById('cy').innerHTML=`<div class="empty">图谱载入失败：${escapeHtml(error.message)}</div>`;return false}}
    function renderNode(node){const data=node.data();const neighbors=node.neighborhood().nodes().map(item=>item.data('label'));panel.innerHTML=`<h1>${escapeHtml(data.label)}</h1><p>${data.type==='idea'?'Idea':data.type==='problem'?'问题':'阻塞点'}</p><dl class="facts"><dt>ID</dt><dd>${escapeHtml(data.id)}</dd>${data.status?`<dt>状态</dt><dd>${escapeHtml(data.status)}</dd>`:''}<dt>相邻节点</dt><dd>${neighbors.map(escapeHtml).join('、')||'无'}</dd></dl>${data.file?`<a class="open" href="viewer.html?id=${encodeURIComponent(data.id)}">打开 Idea</a>`:''}`}
    function filter(query){if(!cy)return;const value=query.trim().toLowerCase();cy.elements().removeClass('faded');if(!value)return;cy.nodes().forEach(node=>{if(!String(node.data('label')).toLowerCase().includes(value)&&!String(node.id()).toLowerCase().includes(value))node.addClass('faded')});const match=cy.nodes().filter(node=>!node.hasClass('faded'));if(match.length)cy.fit(match,80)}
    start();
    window.addEventListener('message',async event=>{if(event.origin!=='http://127.0.0.1:18080'||event.source!==window.parent||event.data?.type!=='kb-refresh')return;const ok=await start();window.parent.postMessage({type:'kb-refresh-result',ok,surface:'graph',error:ok?null:'Idea 图谱重新载入失败'},'http://127.0.0.1:18080')});
  </script>
</body>
</html>
