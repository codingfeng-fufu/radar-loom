<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>技术雷达知识库</title>
  <link rel="stylesheet" href="vendor/highlight/github.min.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <style>
    :root {
      color-scheme: light;
      --ui-bg: #f7f8f7; --ui-surface: #ffffff; --ui-surface-soft: #eef1ef; --ui-text: #202421; --ui-muted: #66706a; --ui-border: #d8ded9; --ui-accent: #087f68; --ui-success: #18794e; --ui-warning: #9a6700; --ui-danger: #b42318;
      --ink: var(--ui-text);
      --muted: var(--ui-muted);
      --line: var(--ui-border);
      --paper: var(--ui-surface);
      --sidebar: var(--ui-surface-soft);
      --accent: var(--ui-accent);
      --accent-soft: #e5f3ef;
      --warn: var(--ui-danger);
      --code: #f5f7f8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
    body { font: 15px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    button, input, select { font: inherit; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow: auto;
      border-right: 1px solid var(--line); background: var(--sidebar); padding: 20px 16px 32px;
    }
    .brand { margin: 0 0 18px; font-size: 18px; line-height: 1.3; }
    .brand a { color: var(--ink); text-decoration: none; }
    .section-tabs { display: grid; grid-template-columns: 1fr 1fr; height: 36px; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .section-tab { min-width: 0; border: 0; border-right: 1px solid var(--line); background: var(--paper); color: var(--muted); cursor: pointer; font-weight: 700; }
    .section-tab:last-child { border-right: 0; }
    .section-tab[aria-selected="true"] { background: var(--accent); color: #fff; }
    .nav-tools { position: sticky; top: -20px; z-index: 4; margin: 0 -4px 12px; padding: 8px 4px; background: var(--sidebar); }
    .taxonomy-summary { margin: 0 0 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 12px; line-height: 1.4; }
    .taxonomy-summary a { display: block; color: inherit; text-decoration: none; }
    .taxonomy-summary[data-state="candidate"] { color: #26734d; }
    .taxonomy-summary[data-state="rejected"] { color: #946c16; }
    .taxonomy-summary[data-state="failed"], .taxonomy-summary[data-state="stale"], .taxonomy-summary[data-state="unavailable"] { color: #a33b2b; }
    .nav-search-row { display: grid; grid-template-columns: minmax(0, 1fr) 34px; gap: 6px; }
    .nav-search { width: 100%; height: 36px; border: 1px solid #b7c0c8; border-radius: 4px; padding: 0 10px; background: var(--paper); color: var(--ink); }
    .nav-search:focus { border-color: var(--accent); outline: 2px solid rgb(11 107 87 / 14%); outline-offset: 0; }
    .interview-filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 7px; }
    .interview-filters[hidden] { display: none; }
    .nav-filter { width: 100%; min-width: 0; height: 34px; border: 1px solid #b7c0c8; border-radius: 4px; padding: 0 5px; background: var(--paper); color: var(--ink); font-size: 12px; }
    .nav-tool-button { width: 34px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); cursor: pointer; }
    .nav-tool-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .search-results-list { display: grid; gap: 6px; }
    .search-card { display: block; border: 1px solid var(--line); border-radius: 4px; padding: 8px; background: var(--paper); color: var(--ink); text-decoration: none; }
    .search-card:hover, .search-card[aria-current="page"] { border-color: var(--accent); background: var(--accent-soft); }
    .search-card strong, .search-card small { display: block; }
    .search-card small { margin-top: 3px; color: var(--muted); line-height: 1.35; }
    .search-tags { margin-top: 5px; color: var(--accent); font-size: 11px; }
    .nav-retry { border: 1px solid var(--line); border-radius: 4px; background: var(--paper); padding: 6px 9px; cursor: pointer; }
    .nav-group { border-top: 1px solid var(--line); padding: 8px 0; }
    .nav-group summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 700; }
    .nav-list { list-style: none; margin: 7px 0 0; padding: 0; }
    .nav-list a { display: block; padding: 5px 8px; border-radius: 4px; color: var(--ink); text-decoration: none; line-height: 1.35; }
    .nav-list a:hover, .nav-list a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
    .main { min-width: 0; }
    .toolbar { display: none; height: 52px; align-items: center; border-bottom: 1px solid var(--line); padding: 0 12px; }
    .icon-button { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); cursor: pointer; font-size: 20px; }
    .document { width: min(920px, calc(100% - 64px)); margin: 0 auto; padding: 48px 0 80px; }
    .status { color: var(--muted); padding: 24px 0; }
    .error { border-left: 4px solid var(--warn); padding: 12px 16px; background: #fff4f0; color: #702a19; }
    .frontmatter { margin: 0 0 28px; border: 1px solid var(--line); border-radius: 4px; background: var(--sidebar); }
    .frontmatter summary { cursor: pointer; padding: 8px 12px; color: var(--muted); font-weight: 700; }
    .frontmatter pre { margin: 0; padding: 0 12px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    article h1, article h2, article h3 { line-height: 1.3; margin: 1.7em 0 .65em; letter-spacing: 0; }
    article h1 { margin-top: 0; font-size: 30px; }
    article h2 { padding-bottom: 7px; border-bottom: 1px solid var(--line); font-size: 22px; }
    article h3 { font-size: 18px; }
    article img, article svg { max-width: 100%; height: auto; }
    article table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
    article th, article td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
    article blockquote { margin-left: 0; padding: 4px 16px; border-left: 4px solid var(--line); color: var(--muted); }
    article :not(pre) > code { padding: 2px 5px; border-radius: 3px; background: var(--code); }
    article pre { overflow: auto; padding: 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--code); }
    article pre code { padding: 0; }
    article .katex-display { max-width: 100%; overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    .mermaid { overflow-x: auto; text-align: center; }
    .scrim { display: none; }
    @media (max-width: 760px) {
      .shell { display: block; }
      .toolbar { display: flex; position: sticky; top: 0; z-index: 10; background: var(--paper); }
      .sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(320px, 86vw); transform: translateX(-102%); transition: transform 160ms ease; box-shadow: 8px 0 24px rgb(0 0 0 / 12%); }
      body.nav-open .sidebar { transform: translateX(0); }
      body.nav-open .scrim { display: block; position: fixed; z-index: 20; inset: 0; border: 0; background: rgb(0 0 0 / 32%); }
      .document { width: min(100% - 32px, 920px); padding-top: 28px; }
      .interview-filters { grid-template-columns: 1fr; }
      article h1 { font-size: 26px; }
    }
  </style>
  <script src="vendor/marked/marked.min.js"></script>
  <script src="vendor/dompurify/purify.min.js"></script>
  <script src="vendor/highlight/highlight.min.js"></script>
  <script src="vendor/mermaid/mermaid.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/auto-render.min.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="知识库目录">
      <h1 class="brand"><a href="viewer.html">技术雷达知识库</a></h1>
      <div class="section-tabs" id="primarySections" role="tablist" aria-label="主要内容区">
        <button class="section-tab" id="knowledgeTab" type="button" role="tab" data-section="knowledge" aria-controls="viewerPanel" aria-selected="true" tabindex="0">知识库</button>
        <button class="section-tab" id="interviewTab" type="button" role="tab" data-section="interview" aria-controls="viewerPanel" aria-selected="false" tabindex="-1">工程面试</button>
      </div>
      <div id="taxonomySummary" class="taxonomy-summary" aria-live="polite"></div>
      <div class="nav-tools">
        <div class="nav-search-row">
          <input class="nav-search" id="navigationSearch" type="search" aria-label="搜索知识页" placeholder="搜索标题、摘要或标签" autocomplete="off">
          <button class="nav-tool-button" id="collapseAll" type="button" aria-label="全部折叠" title="全部折叠"><svg data-icon="collapse" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5-5 5 5"/><path d="M7 20h10M7 4h10"/></svg></button>
        </div>
        <div class="interview-filters" id="interviewFilters" hidden>
          <select class="nav-filter" id="roleFilter" aria-label="岗位筛选"><option value="">全部岗位</option></select>
          <select class="nav-filter" id="difficultyFilter" aria-label="难度筛选"><option value="">全部难度</option></select>
          <select class="nav-filter" id="tagFilter" aria-label="知识方向筛选"><option value="">全部方向</option></select>
        </div>
      </div>
      <nav id="navigation" aria-live="polite"><div class="nav-skeleton"><p class="status">正在读取索引...</p></div></nav>
    </aside>
    <button class="scrim" id="scrim" aria-label="关闭导航"></button>
    <main class="main" id="viewerPanel" role="tabpanel" aria-labelledby="knowledgeTab">
      <div class="toolbar">
        <button class="icon-button" id="menuButton" type="button" aria-label="打开导航" title="打开导航">☰</button>
      </div>
      <div class="document">
        <div id="message" class="status" role="status">正在载入...</div>
        <details id="frontmatter" class="frontmatter" hidden>
          <summary>页面元数据</summary>
          <pre id="frontmatterText"></pre>
        </details>
        <article id="content"></article>
      </div>
    </main>
  </div>

  <script>
    const DEFAULT_FILE = '首页.md';
    const ROOT_FILES = new Set(['首页.md', '_index.md', '_interview_index.md', 'graph.md', 'interview-graph.md']);
    const elements = {
      content: document.querySelector('#content'),
      frontmatter: document.querySelector('#frontmatter'),
      frontmatterText: document.querySelector('#frontmatterText'),
      message: document.querySelector('#message'),
      navigation: document.querySelector('#navigation'),
      taxonomySummary: document.querySelector('#taxonomySummary'),
      navigationSearch: document.querySelector('#navigationSearch'),
      collapseAll: document.querySelector('#collapseAll'),
      interviewFilters: document.querySelector('#interviewFilters'),
      roleFilter: document.querySelector('#roleFilter'),
      difficultyFilter: document.querySelector('#difficultyFilter'),
      tagFilter: document.querySelector('#tagFilter')
    };
    const SECTIONS = {
      knowledge: { indexUrl: '_index.md', defaultFile: DEFAULT_FILE, navigationKey: 'radar-viewer-navigation-knowledge-v1', activeFileKey: 'radar-viewer-active-file-knowledge-v1' },
      interview: { indexUrl: '_interview_index.md', defaultFile: null, navigationKey: 'radar-viewer-navigation-interview-v1', activeFileKey: 'radar-viewer-active-file-interview-v1' }
    };
    const NAVIGATION_STATE_KEY = 'radar-viewer-navigation-v1';
    const WORKBENCH_ORIGIN = 'http://127.0.0.1:18080';
    let activeSection = 'knowledge';
    let navigationGeneration = 0;
    const navigationStates = Object.fromEntries(Object.keys(SECTIONS).map((section) => [section, {
      groups: [], entries: [], activeFile: SECTIONS[section].defaultFile, expanded: new Set(), initialized: false,
      search: '', filters: { role: '', difficulty: '', tag: '' }
    }]));
    let navigationState = navigationStates.knowledge;

    function validatePath(value) {
      if (!value || typeof value !== 'string' || value.startsWith('/') || value.includes('\\')) return false;
      if (value.includes('?') || value.includes('#') || !value.endsWith('.md')) return false;
      const segments = value.split('/');
      if (segments.some((segment) => !segment || segment === '.' || segment === '..')) return false;
      if (segments.length === 1) return ROOT_FILES.has(value) || /^graph_[a-z]+\.md$/.test(value);
      return segments.length === 2 && segments[0] === 'pages' && segments[1].endsWith('.md');
    }

    function splitFrontmatter(source) {
      const match = source.match(/^---\s*\n([\s\S]*?)\n---\s*(?:\n|$)/);
      return match
        ? { metadata: match[1].trim(), body: source.slice(match[0].length) }
        : { metadata: '', body: source };
    }

    function parseMetadata(metadata) {
      const result = {};
      for (const line of metadata.split(/\r?\n/)) {
        const match = line.match(/^([\w\u4e00-\u9fff-]+):\s*(.*)$/);
        if (!match) continue;
        const value = match[2].trim();
        result[match[1]] = /^\[.*\]$/.test(value)
          ? value.slice(1, -1).split(',').map((item) => item.trim().replace(/^['"]|['"]$/g, '')).filter(Boolean)
          : value.replace(/^['"]|['"]$/g, '');
      }
      return result;
    }

    function sectionForFile(file, metadata = {}) {
      if (metadata.page_type === 'interview' || metadata.pageType === 'interview') return 'interview';
      if (Object.keys(metadata).length) return 'knowledge';
      const requested = new URLSearchParams(location.search).get('section');
      if (requested === 'knowledge' || requested === 'interview') return requested;
      return 'knowledge';
    }

    function viewerHref(name, section = activeSection) {
      const target = name.endsWith('.md') ? name : `pages/${name}.md`;
      return `viewer.html?section=${section}&f=${encodeURIComponent(target)}`;
    }

    function canonicalViewerUrl(file, section) {
      return `viewer.html?section=${section}&f=${encodeURIComponent(file)}`;
    }

    function rewriteWikilinks(markdown) {
      return markdown.replace(/\[\[([^\]|\n]+)(?:\|([^\]\n]+))?\]\]/g, (_all, target, alias) => {
        const cleanTarget = target.trim();
        const label = (alias || target).trim().replace(/([\[\]])/g, '\\$1');
        return `[${label}](${viewerHref(cleanTarget)})`;
      });
    }

    function extractMathRegions(markdown) {
      const regions = [];
      let output = '';
      let index = 0;
      const store = (source) => {
        const token = `MATHREGION_${regions.length}_END`;
        regions.push({ token, source });
        output += token;
      };
      const closingAt = (delimiter, from) => {
        let found = markdown.indexOf(delimiter, from);
        while (found >= 0 && markdown[found - 1] === '\\') found = markdown.indexOf(delimiter, found + delimiter.length);
        return found;
      };
      while (index < markdown.length) {
        const lineStart = index === 0 || markdown[index - 1] === '\n';
        const fence = lineStart && (markdown.startsWith('```', index) || markdown.startsWith('~~~', index))
          ? markdown.slice(index, index + 3) : null;
        if (fence) {
          const close = markdown.indexOf(`\n${fence}`, index + 3);
          const end = close < 0 ? markdown.length : (markdown.indexOf('\n', close + 1) + 1 || markdown.length);
          output += markdown.slice(index, end);
          index = end;
          continue;
        }
        if (markdown[index] === '`') {
          let run = 1;
          while (markdown[index + run] === '`') run += 1;
          const delimiter = '`'.repeat(run);
          const close = markdown.indexOf(delimiter, index + run);
          const end = close < 0 ? index + run : close + run;
          output += markdown.slice(index, end);
          index = end;
          continue;
        }
        const delimiters = markdown.startsWith('$$', index) ? ['$$', '$$']
          : markdown.startsWith('\\[', index) ? ['\\[', '\\]']
          : markdown.startsWith('\\(', index) ? ['\\(', '\\)']
          : markdown[index] === '$' && markdown[index - 1] !== '\\' ? ['$', '$'] : null;
        if (delimiters) {
          const close = closingAt(delimiters[1], index + delimiters[0].length);
          if (close >= 0) {
            const end = close + delimiters[1].length;
            store(markdown.slice(index, end));
            index = end;
            continue;
          }
        }
        output += markdown[index];
        index += 1;
      }
      return { markdown: output, regions };
    }

    function restoreMathRegions(root, regions) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        let value = node.nodeValue;
        for (const region of regions) value = value.replaceAll(region.token, () => region.source);
        node.nodeValue = value;
      }
    }

    function parseIndex(markdown) {
      const groups = [];
      let current = null;
      const entries = new Map();
      for (const line of markdown.split(/\r?\n/)) {
        const heading = line.match(/^##\s+(.+?)\s*$/);
        if (heading) {
          current = { name: heading[1], pages: [] };
          groups.push(current);
          continue;
        }
        const item = line.match(/^-\s+\[\[([^\]|]+)(?:\|([^\]]+))?\]\](?:\s+`([^`]*)`)?(?:\s+—\s+(.*))?$/);
        if (!current || !item) continue;
        const title = item[1].trim();
        const file = `pages/${title}.md`;
        const tags = (item[3] || '').match(/#[^\s#]+/g)?.map((tag) => tag.slice(1)) || [];
        const aliases = item[2] ? [item[2].trim()] : [];
        const entry = entries.get(file) || { title, file, summary: '', tags: [], aliases: [], categories: [] };
        if (item[4]) entry.summary = item[4].trim();
        entry.tags = [...new Set([...entry.tags, ...tags])];
        entry.aliases = [...new Set([...entry.aliases, ...aliases])];
        if (!entry.categories.includes(current.name)) entry.categories.push(current.name);
        entry.searchText = normalizeSearch([entry.title, entry.summary, ...entry.tags, ...entry.aliases].join(' '));
        entries.set(file, entry);
        current.pages.push(entry);
      }
      return { groups: groups.filter((group) => group.pages.length), entries: [...entries.values()] };
    }

    function parseInterviewIndex(markdown) {
      const groups = [];
      const entries = new Map();
      let current = null;
      for (const line of markdown.split(/\r?\n/)) {
        const heading = line.match(/^##\s+(.+?)\s*$/);
        if (heading) {
          current = { name: heading[1].replace(/^\u89d2\u8272:\s*/, ''), pages: [] };
          if (heading[1].startsWith('\u89d2\u8272:')) groups.push(current);
          else current = null;
          continue;
        }
        const item = line.match(/^-\s+\[\[([^\]|]+)(?:\|([^\]]+))?\]\]\s*`([^`]*)`\s+—\s+原问题:\s*(.*?)\s+·\s+摘要:\s*(.*?)\s+·\s+角色:\s*(.*?)\s+·\s+难度:\s*(.*?)\s*$/);
        if (!current || !item) continue;
        const title = item[1].trim();
        const file = `pages/${title}.md`;
        const tags = item[3].match(/#[^\s#]+/g)?.map((tag) => tag.slice(1)) || [];
        const roles = item[6].split(',').map((role) => role.trim()).filter(Boolean);
        let entry = entries.get(file);
        if (!entry) entry = { title, file, question: item[4].trim(), summary: item[5].trim(), tags, roles, difficulty: item[7].trim(), aliases: item[2] ? [item[2].trim()] : [], categories: [] };
        entry.roles = [...new Set([...entry.roles, ...roles])];
        if (!entry.categories.includes(current.name)) entry.categories.push(current.name);
        entry.searchText = normalizeSearch([entry.title, entry.question, entry.summary, ...entry.tags, ...entry.roles, entry.difficulty].join(' '));
        entries.set(file, entry);
        current.pages.push(entry);
      }
      return { groups, entries: [...entries.values()] };
    }

    function setMessage(text, isError = false) {
      elements.message.textContent = text;
      elements.message.hidden = !text;
      elements.message.className = isError ? 'error' : 'status';
      elements.message.setAttribute('role', isError ? 'alert' : 'status');
    }

    function notifyRefreshResult(ok, error = '') {
      if (window.parent === window) return;
      window.parent.postMessage({ type: 'kb-refresh-result', ok, surface: 'viewer', revision: sessionStorage.getItem('kb-revision') || '', error }, WORKBENCH_ORIGIN);
    }

    function notifyActiveFile(file, title, metadata = {}) {
      if (window.parent === window) return;
      const pageType = metadata.page_type || metadata.pageType;
      const context = pageType === 'interview'
        ? { kind: 'page', pageType: 'interview', file, title, question: metadata.question || metadata.original_question || metadata['原问题'] || '', roles: Array.isArray(metadata.roles) ? metadata.roles : [], difficulty: metadata.difficulty || '' }
        : { kind: 'page', file, title: title || file.split('/').pop().replace(/\.md$/, '') };
      window.parent.postMessage({
        type: 'kb-context',
        context
      }, WORKBENCH_ORIGIN);
    }

    function normalizeSearch(value) {
      return String(value || '').normalize('NFKC').toLocaleLowerCase('zh-CN').trim();
    }

    function restoreNavigationState() {
      try {
        const stored = sessionStorage.getItem(SECTIONS[activeSection].navigationKey)
          || (activeSection === 'knowledge' ? sessionStorage.getItem(NAVIGATION_STATE_KEY) : null);
        const parsed = JSON.parse(stored || '{}');
        if (Array.isArray(parsed.expanded)) navigationState.expanded = new Set(parsed.expanded.filter((item) => typeof item === 'string'));
        navigationState.search = typeof parsed.search === 'string' ? parsed.search : '';
        navigationState.filters = { ...navigationState.filters, ...(parsed.filters || {}) };
        navigationState.activeFile = sessionStorage.getItem(SECTIONS[activeSection].activeFileKey) || navigationState.activeFile;
      } catch (_error) {
        navigationState.expanded = new Set();
      }
    }

    function saveNavigationState() {
      sessionStorage.setItem(SECTIONS[activeSection].navigationKey, JSON.stringify({ expanded: [...navigationState.expanded], search: navigationState.search, filters: navigationState.filters }));
      if (navigationState.activeFile) sessionStorage.setItem(SECTIONS[activeSection].activeFileKey, navigationState.activeFile);
    }

    function pageLink(entry, className = '') {
      const link = document.createElement('a');
      link.href = `viewer.html?section=${activeSection}&f=${encodeURIComponent(entry.file)}`;
      link.dataset.file = entry.file;
      link.dataset.section = activeSection;
      link.className = className;
      link.textContent = entry.title;
      if (entry.file === navigationState.activeFile) link.setAttribute('aria-current', 'page');
      return link;
    }

    function updateActiveNavigation(file) {
      navigationState.activeFile = file;
      saveNavigationState();
      elements.navigation.querySelectorAll('a[data-file]').forEach((link) => {
        if (link.dataset.file === file) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
    }

    function renderCategorizedNavigation() {
      elements.navigation.replaceChildren();
      const graphLink = document.createElement('a');
      graphLink.href = `graph-view.html?profile=${activeSection}&mode=taxonomy`;
      graphLink.textContent = '交互图谱';
      graphLink.className = 'nav-list';
      graphLink.style.padding = '8px';
      elements.navigation.append(graphLink);
      for (const group of navigationState.groups) {
        const details = document.createElement('details');
        details.className = 'nav-group';
        details.dataset.group = group.name;
        const containsActive = group.pages.some((entry) => entry.file === navigationState.activeFile);
        details.open = navigationState.initialized ? navigationState.expanded.has(group.name) : containsActive;
        const summary = document.createElement('summary');
        summary.textContent = group.name;
        const list = document.createElement('ul');
        list.className = 'nav-list';
        for (const entry of group.pages) {
          const link = pageLink(entry);
          const item = document.createElement('li');
          item.append(link);
          list.append(item);
        }
        details.addEventListener('toggle', () => {
          if (details.open) navigationState.expanded.add(group.name);
          else navigationState.expanded.delete(group.name);
          saveNavigationState();
        });
        details.append(summary, list);
        elements.navigation.append(details);
      }
      navigationState.initialized = true;
    }

    function taxonomyDataUrl(section) {
      return section === 'interview' ? 'interview-graph-data.json' : 'graph-data.json';
    }

    let taxonomyRefreshGeneration = 0;

    function refreshTaxonomySummary(section = activeSection) {
      const refreshToken = ++taxonomyRefreshGeneration;
      const summary = elements.taxonomySummary;
      summary.replaceChildren();
      summary.removeAttribute('data-state');
      const link = document.createElement('a');
      link.href = `graph-view.html?profile=${section}&mode=taxonomy`;
      link.textContent = '动态分类：读取中...';
      summary.append(link);
      return fetch(taxonomyDataUrl(section), { cache: 'no-store' })
        .then((response) => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
        .then((data) => {
          if (refreshToken !== taxonomyRefreshGeneration || activeSection !== section) return;
          const taxonomy = data?.taxonomy;
          const stats = taxonomy && taxonomy.stats;
          if (!taxonomy || typeof taxonomy !== 'object') throw new Error('invalid taxonomy schema');
          const publish = taxonomy.publish && typeof taxonomy.publish === 'object' ? taxonomy.publish : {};
          const categories = Array.isArray(taxonomy.categories) ? taxonomy.categories : [];
          const hasNumber = (value) => typeof value === 'number' && Number.isFinite(value);
          const countValue = (value) => Array.isArray(value) ? value.length : (hasNumber(value) ? value : null);
          const candidates = countValue(taxonomy.candidates) ?? countValue(publish.candidates) ?? countValue(stats?.candidates) ?? 0;
          const sourceCounts = categories.reduce((counts, category) => {
            if (category && category.source === 'seed') counts.seed += 1;
            if (category && category.source === 'automatic') counts.automatic += 1;
            return counts;
          }, { seed: 0, automatic: 0 });
          const seedCategories = hasNumber(stats?.seedCategories) ? stats.seedCategories : sourceCounts.seed;
          const automaticCategories = hasNumber(stats?.automaticCategories) ? stats.automaticCategories : sourceCounts.automatic;
          const activeCategories = hasNumber(stats?.activeCategories) ? stats.activeCategories : categories.length;
          const forming = hasNumber(stats?.forming) ? stats.forming : categories.filter((category) => category?.status === 'forming').length;
          const lastRun = (taxonomy.lastRun && typeof taxonomy.lastRun === 'object' ? taxonomy.lastRun : publish.lastRun) || {};
          const outcome = String(lastRun.outcome || '').toLowerCase();
          const state = outcome === 'failed' ? 'failed' : outcome === 'rejected' ? 'rejected' : ['adopted', 'unchanged', 'idle'].includes(outcome) ? 'neutral' : candidates > 0 ? 'candidate' : 'neutral';
          summary.dataset.state = state;
          const reason = String(lastRun.reason || lastRun.message || '').trim();
          const label = state === 'failed' ? '分类数据未更新' : state === 'rejected' ? `结构未更新${reason ? `：${reason}` : ''}` : state === 'candidate' ? `动态分类：${candidates} 个候选` : '动态分类：无变化';
          link.textContent = `${label} · 种子 ${seedCategories} · 自动 ${automaticCategories} · 活跃 ${activeCategories} · 形成中 ${forming}`;
        })
        .catch(() => {
          if (refreshToken !== taxonomyRefreshGeneration || activeSection !== section) return;
          summary.dataset.state = 'unavailable';
          link.textContent = '动态分类状态不可用';
        });
    }

    function renderSearchResults(matches) {
      elements.navigation.replaceChildren();
      const results = document.createElement('div');
      results.className = 'search-results-list';
      const active = navigationState.entries.find((entry) => entry.file === navigationState.activeFile);
      const ordered = active && !matches.some((entry) => entry.file === active.file) ? [active, ...matches] : matches;
      if (!ordered.length) {
        const empty = document.createElement('p');
        empty.className = 'status';
        empty.textContent = '未找到匹配页面';
        elements.navigation.append(empty);
        return;
      }
      for (const entry of ordered) {
        const card = pageLink(entry, 'search-card');
        card.textContent = '';
        const title = document.createElement('strong');
        title.textContent = entry.file === navigationState.activeFile && !matches.includes(entry) ? `当前页面 · ${entry.title}` : entry.title;
        card.append(title);
        if (entry.summary) {
          const summary = document.createElement('small');
          summary.textContent = entry.summary;
          card.append(summary);
        }
        if (entry.tags.length) {
          const tags = document.createElement('div');
          tags.className = 'search-tags';
          tags.textContent = entry.tags.map((tag) => `#${tag}`).join(' ');
          card.append(tags);
        }
        results.append(card);
      }
      elements.navigation.append(results);
    }

    function filterNavigation(query) {
      const terms = normalizeSearch(query).split(/\s+/).filter(Boolean);
      navigationState.search = query;
      navigationState.filters = { role: elements.roleFilter.value, difficulty: elements.difficultyFilter.value, tag: elements.tagFilter.value };
      saveNavigationState();
      const hasInterviewFilters = activeSection === 'interview' && Object.values(navigationState.filters).some(Boolean);
      if (!terms.length && !hasInterviewFilters) {
        renderCategorizedNavigation();
        return;
      }
      const matches = navigationState.entries
        .filter((entry) => terms.every((term) => entry.searchText.includes(term)))
        .filter((entry) => !navigationState.filters.role || entry.roles?.includes(navigationState.filters.role))
        .filter((entry) => !navigationState.filters.difficulty || entry.difficulty === navigationState.filters.difficulty)
        .filter((entry) => !navigationState.filters.tag || entry.tags.includes(navigationState.filters.tag))
        .sort((left, right) => {
          const normalized = normalizeSearch(query);
          const score = (entry) => normalizeSearch(entry.title).startsWith(normalized) ? 0
            : normalizeSearch(entry.title).includes(normalized) ? 1
              : entry.aliases.some((alias) => normalizeSearch(alias).includes(normalized)) ? 2
                : entry.tags.some((tag) => normalizeSearch(tag).includes(normalized)) ? 3 : 4;
          return score(left) - score(right) || left.title.localeCompare(right.title, 'zh-CN');
        });
      renderSearchResults(matches);
    }

    function fillSelect(select, values, label) {
      const selected = select.value;
      select.replaceChildren(new Option(label, ''), ...values.map((value) => new Option(value, value)));
      select.value = values.includes(selected) ? selected : '';
    }

    function configureInterviewFilters() {
      elements.interviewFilters.hidden = activeSection !== 'interview';
      elements.navigationSearch.setAttribute('aria-label', activeSection === 'interview' ? '搜索面试页' : '搜索知识页');
      if (activeSection !== 'interview') return;
      fillSelect(elements.roleFilter, [...new Set(navigationState.entries.flatMap((entry) => entry.roles))].sort(), '全部岗位');
      fillSelect(elements.difficultyFilter, [...new Set(navigationState.entries.map((entry) => entry.difficulty).filter(Boolean))], '全部难度');
      fillSelect(elements.tagFilter, [...new Set(navigationState.entries.flatMap((entry) => entry.tags))].sort(), '全部方向');
      elements.roleFilter.value = navigationState.filters.role;
      elements.difficultyFilter.value = navigationState.filters.difficulty;
      elements.tagFilter.value = navigationState.filters.tag;
    }

    async function fetchIndexData(section) {
      const response = await fetch(SECTIONS[section].indexUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const source = await response.text();
      return section === 'interview' ? parseInterviewIndex(source) : parseIndex(source);
    }

    async function fetchPageData(file) {
      const response = await fetch(file, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const { metadata, body } = splitFrontmatter(await response.text());
      return { metadata, body, pageMetadata: parseMetadata(metadata) };
    }

    function resolveSectionFile(requestedFile = null) {
      if (requestedFile) return requestedFile;
      return navigationState.activeFile || navigationState.entries[0]?.file || null;
    }

    function updateSectionTabs(section) {
      document.querySelectorAll('[role="tab"][data-section]').forEach((tab) => {
        const selected = tab.dataset.section === section;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      document.querySelector('#viewerPanel').setAttribute('aria-labelledby', section === 'interview' ? 'interviewTab' : 'knowledgeTab');
    }

    async function renderPageData(file, section, page, token) {
        const { metadata, body, pageMetadata } = page;
        elements.frontmatter.hidden = !metadata;
        elements.frontmatterText.textContent = metadata;
        const math = extractMathRegions(rewriteWikilinks(body));
        const rendered = marked.parse(math.markdown, { gfm: true, breaks: false });
        elements.content.innerHTML = DOMPurify.sanitize(rendered, { USE_PROFILES: { html: true } });
        restoreMathRegions(elements.content, math.regions);
        renderMathInElement(elements.content, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false,
          trust: false,
          strict: 'warn'
        });
        elements.content.querySelectorAll('pre code:not(.language-mermaid)').forEach((block) => hljs.highlightElement(block));
        elements.content.querySelectorAll('pre code.language-mermaid').forEach((block) => {
          const container = document.createElement('div');
          container.className = 'mermaid';
          container.textContent = block.textContent;
          block.parentElement.replaceWith(container);
        });
        await mermaid.run({ nodes: elements.content.querySelectorAll('.mermaid') });
        if (token !== navigationGeneration) return;
        const pageTitle = elements.content.querySelector('h1')?.textContent?.trim() || file.split('/').pop().replace(/\.md$/, '');
        document.title = `${pageTitle} · 技术雷达`;
        setMessage('');
        updateActiveNavigation(file);
        notifyActiveFile(file, pageTitle, pageMetadata);
    }

    function commitSection(section, parsed, file) {
      activeSection = section;
      navigationState = navigationStates[section];
      navigationState.groups = parsed.groups;
      navigationState.entries = parsed.entries;
      restoreNavigationState();
      navigationState.activeFile = file;
      updateSectionTabs(section);
      elements.navigationSearch.value = navigationState.search;
      configureInterviewFilters();
      filterNavigation(navigationState.search);
      refreshTaxonomySummary(section);
    }

    async function navigateTo(requestedFile = null, { sectionHint = activeSection, historyMode = 'replace' } = {}) {
      const token = ++navigationGeneration;
      const hintedSection = SECTIONS[sectionHint] ? sectionHint : 'knowledge';
      if (requestedFile && !validatePath(requestedFile)) {
        if (token !== navigationGeneration) return;
        setMessage('已拒绝：文件路径不在知识库允许范围内。', true);
        return;
      }
      navigationState.search = elements.navigationSearch.value;
      saveNavigationState();
      try {
        let parsed = await fetchIndexData(hintedSection);
        if (token !== navigationGeneration) return;
        const persistedFile = sessionStorage.getItem(SECTIONS[hintedSection].activeFileKey);
        const file = requestedFile || persistedFile || parsed.entries[0]?.file || null;
        if (!file) {
          if (token !== navigationGeneration) return;
          commitSection(hintedSection, parsed, null);
          const url = `viewer.html?section=${hintedSection}`;
          if (historyMode === 'push') history.pushState({ file: null, section: hintedSection }, '', url);
          else if (historyMode === 'replace') history.replaceState({ file: null, section: hintedSection }, '', url);
          elements.content.replaceChildren();
          elements.frontmatter.hidden = true;
          setMessage('当前专区暂无页面。');
          return;
        }
        const page = await fetchPageData(file);
        if (token !== navigationGeneration) return;
        const detectedSection = sectionForFile(file, page.pageMetadata) || hintedSection;
        if (detectedSection !== hintedSection) {
          parsed = await fetchIndexData(detectedSection);
          if (token !== navigationGeneration) return;
        }
        if (token !== navigationGeneration) return;
        commitSection(detectedSection, parsed, file);
        const canonicalUrl = canonicalViewerUrl(file, detectedSection);
        if (historyMode === 'push') history.pushState({ file, section: detectedSection }, '', canonicalUrl);
        else if (historyMode === 'replace') history.replaceState({ file, section: detectedSection }, '', canonicalViewerUrl(file, detectedSection));
        await renderPageData(file, detectedSection, page, token);
        if (token !== navigationGeneration) return;
        return true;
      } catch (error) {
        if (token !== navigationGeneration) return;
        elements.navigation.replaceChildren();
        const message = document.createElement('p');
        message.className = 'error';
        message.textContent = `载入失败：${error.message}`;
        const retry = document.createElement('button');
        retry.className = 'nav-retry';
        retry.type = 'button';
        retry.textContent = '重试';
        const failedIntent = { requestedFile, sectionHint: hintedSection, historyMode };
        retry.addEventListener('click', () => navigateTo(failedIntent.requestedFile, failedIntent));
        elements.navigation.append(message, retry);
        setMessage(`未能打开目标页，当前内容已保留：${error.message}`, true);
        return false;
      }
    }

    function retryIndexLoad(section = activeSection) {
      return navigateTo(navigationStates[section].activeFile, { sectionHint: section, historyMode: 'replace' });
    }

    function switchSection(section) {
      return navigateTo(null, { sectionHint: section, historyMode: 'push' });
    }

    function renderMarkdown(file, expectedSection = activeSection, historyMode = 'replace') {
      return navigateTo(file, { sectionHint: expectedSection, historyMode });
    }

    function closeNavigation() { document.body.classList.remove('nav-open'); }
    window.addEventListener('message', (event) => {
      if (event.origin !== WORKBENCH_ORIGIN) return;
      if (event.data?.type === 'kb-open-navigation') document.body.classList.add('nav-open');
      if (event.data?.type === 'kb-refresh') retryIndexLoad(activeSection).then((ok) => notifyRefreshResult(ok, ok ? '' : '当前页面恢复失败'));
    });
    document.querySelector('.section-tabs').addEventListener('click', (event) => {
      const tab = event.target.closest('[role="tab"][data-section]');
      if (tab && tab.dataset.section !== activeSection) switchSection(tab.dataset.section);
    });
    function handleSectionTabKeydown(event) {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      const tabs = [...document.querySelectorAll('[role="tab"][data-section]')];
      const current = tabs.indexOf(event.target);
      if (current < 0) return;
      event.preventDefault();
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1
        : (current + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      tabs[next].focus();
      if (tabs[next].dataset.section !== activeSection) switchSection(tabs[next].dataset.section);
    }
    document.querySelector('#primarySections').addEventListener('keydown', handleSectionTabKeydown);
    document.querySelector('#menuButton').addEventListener('click', () => document.body.classList.toggle('nav-open'));
    document.querySelector('#scrim').addEventListener('click', closeNavigation);
    elements.navigationSearch.addEventListener('input', () => filterNavigation(elements.navigationSearch.value));
    [elements.roleFilter, elements.difficultyFilter, elements.tagFilter].forEach((select) => select.addEventListener('change', () => filterNavigation(elements.navigationSearch.value)));
    elements.collapseAll.addEventListener('click', () => {
      navigationState.expanded.clear();
      saveNavigationState();
      elements.navigationSearch.value = '';
      renderCategorizedNavigation();
    });
    document.addEventListener('click', (event) => {
      const link = event.target.closest('a[href^="viewer.html?"]');
      if (!link) return;
      const file = link.dataset.file || new URL(link.href).searchParams.get('f');
      if (!validatePath(file)) return;
      event.preventDefault();
      const section = link.dataset.section || new URL(link.href).searchParams.get('section') || activeSection;
      navigateTo(file, { sectionHint: section, historyMode: 'push' });
      closeNavigation();
    });
    window.addEventListener('popstate', () => {
      const params = new URLSearchParams(location.search);
      const section = params.get('section') === 'interview' ? 'interview' : 'knowledge';
      const file = params.get('f');
      navigateTo(file, { sectionHint: section, historyMode: 'none' });
    });
    document.addEventListener('keydown', (event) => {
      const editable = event.target.matches('input,textarea,[contenteditable="true"]');
      if (event.key === '/' && !editable) {
        event.preventDefault();
        elements.navigationSearch.focus();
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        elements.navigationSearch.focus();
      }
      if (event.key === 'Escape') {
        if (elements.navigationSearch.value) {
          elements.navigationSearch.value = '';
          filterNavigation('');
        } else closeNavigation();
      }
    });

    function requireRuntime(name, value) {
      if (!value) throw new Error(`${name} 本地资源加载失败，请重新运行 scripts/vendor_web_assets.sh`);
      return value;
    }

    try {
      requireRuntime('Marked', window.marked);
      requireRuntime('DOMPurify', window.DOMPurify);
      requireRuntime('Highlight.js', window.hljs);
      requireRuntime('Mermaid', window.mermaid);
      requireRuntime('KaTeX', window.katex);
      requireRuntime('KaTeX auto-render', window.renderMathInElement);
      marked.setOptions({ mangle: false, headerIds: false });
      mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'neutral' });
      const params = new URLSearchParams(location.search);
      const requestedSection = params.get('section');
      const requestedFile = params.get('f') || (requestedSection === 'interview' ? null : DEFAULT_FILE);
      navigateTo(requestedFile, { sectionHint: requestedSection || 'knowledge', historyMode: 'replace' });
    } catch (error) {
      setMessage(error.message, true);
    }
  </script>
</body>
</html>
