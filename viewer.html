<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>技术雷达知识库</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/highlight/github.min.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <style>
    :root {
      color-scheme: light;
      --ui-bg: #f7f8f7; --ui-surface: #ffffff; --ui-surface-soft: #eef1ef; --ui-text: #202421; --ui-muted: #66706a; --ui-border: #d8ded9; --ui-accent: #087f68; --ui-success: #18794e; --ui-warning: #9a6700; --ui-danger: #b42318;
      --ink: var(--ui-text);
      --muted: var(--ui-muted);
      --line: var(--ui-border);
      --paper: var(--ui-surface);
      --sidebar: var(--ui-surface-soft);
      --accent: var(--ui-accent);
      --accent-soft: #e5f3ef;
      --warn: var(--ui-danger);
      --code: #f5f7f8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
    body { font: 15px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    button, input, select { font: inherit; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow: auto;
      border-right: 1px solid var(--line); background: var(--sidebar); padding: 20px 16px 32px;
    }
    .brand { margin: 0 0 18px; font-size: 18px; line-height: 1.3; }
    .brand a { color: var(--ink); text-decoration: none; }
    .section-tabs { display: grid; grid-template-columns: repeat(3, 1fr); height: 36px; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .section-tab { min-width: 0; border: 0; border-right: 1px solid var(--line); background: var(--paper); color: var(--muted); cursor: pointer; font-weight: 700; }
    .section-tab:last-child { border-right: 0; }
    .section-tab[aria-selected="true"] { background: var(--accent); color: #fff; }
    .nav-tools { position: sticky; top: -20px; z-index: 4; margin: 0 -4px 12px; padding: 8px 4px; background: var(--sidebar); }
    .taxonomy-summary { margin: 0 0 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 12px; line-height: 1.4; }
    .taxonomy-summary a { display: block; color: inherit; text-decoration: none; }
    .taxonomy-summary[data-state="candidate"] { color: #26734d; }
    .taxonomy-summary[data-state="rejected"] { color: #946c16; }
    .taxonomy-summary[data-state="failed"], .taxonomy-summary[data-state="stale"], .taxonomy-summary[data-state="unavailable"] { color: #a33b2b; }
    .nav-search-row { display: grid; grid-template-columns: minmax(0, 1fr) 34px; gap: 6px; }
    .nav-search { width: 100%; height: 36px; border: 1px solid #b7c0c8; border-radius: 4px; padding: 0 10px; background: var(--paper); color: var(--ink); }
    .nav-search:focus { border-color: var(--accent); outline: 2px solid rgb(11 107 87 / 14%); outline-offset: 0; }
    .interview-filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 7px; }
    .interview-filters[hidden] { display: none; }
    .nav-filter { width: 100%; min-width: 0; height: 34px; border: 1px solid #b7c0c8; border-radius: 4px; padding: 0 5px; background: var(--paper); color: var(--ink); font-size: 12px; }
    .nav-tool-button { width: 34px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); cursor: pointer; }
    .nav-tool-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .trash-panel { margin: 8px 0 12px; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
    .trash-panel[hidden] { display: none; }
    .trash-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12px; }
    .trash-item button { border: 1px solid var(--line); border-radius: 3px; background: var(--paper); padding: 2px 6px; cursor: pointer; }
    .quality-issues-panel { margin: 8px 0 12px; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
    .quality-issues-panel[hidden] { display: none; }
    .quality-issue-link { display: block; padding: 4px 0; font-size: 12px; }
    .search-results-list { display: grid; gap: 6px; }
    .search-toolbar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:8px 0; color:var(--muted); font-size:12px; }
    .search-history { display:flex; flex-wrap:wrap; gap:4px; }
    .search-history button { border:1px solid var(--line); border-radius:3px; background:var(--paper); color:var(--muted); padding:2px 6px; cursor:pointer; font-size:11px; }
    .search-pagination { display:flex; justify-content:center; gap:6px; margin-top:8px; }
    .search-pagination button { border:1px solid var(--line); border-radius:3px; background:var(--paper); padding:3px 8px; cursor:pointer; }
    .search-pagination button:disabled { opacity:.45; cursor:default; }
    .search-card { display: block; border: 1px solid var(--line); border-radius: 4px; padding: 8px; background: var(--paper); color: var(--ink); text-decoration: none; }
    .search-card:hover, .search-card[aria-current="page"] { border-color: var(--accent); background: var(--accent-soft); }
    .search-card strong, .search-card small { display: block; }
    .search-card small { margin-top: 3px; color: var(--muted); line-height: 1.35; }
    .search-card mark { padding: 0 1px; border-radius: 2px; background: #ffe29a; color: inherit; }
    .search-tags { margin-top: 5px; color: var(--accent); font-size: 11px; }
    .nav-retry { border: 1px solid var(--line); border-radius: 4px; background: var(--paper); padding: 6px 9px; cursor: pointer; }
    .nav-group { border-top: 1px solid var(--line); padding: 8px 0; }
    .nav-group summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 700; }
    .nav-list { list-style: none; margin: 7px 0 0; padding: 0; }
    .nav-list a { display: block; padding: 5px 8px; border-radius: 4px; color: var(--ink); text-decoration: none; line-height: 1.35; }
    .nav-list a:hover, .nav-list a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
    .main { min-width: 0; }
    .toolbar { display: none; height: 52px; align-items: center; border-bottom: 1px solid var(--line); padding: 0 12px; }
    .icon-button { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); cursor: pointer; font-size: 20px; }
    .document { width: min(920px, calc(100% - 64px)); margin: 0 auto; padding: 48px 0 80px; }
    .reading-tools { position: sticky; top: 8px; z-index: 3; display:flex; gap:8px; align-items:center; margin: -30px 0 18px; pointer-events:none; }
    .reading-tools > * { pointer-events:auto; }
    .reading-toc { max-width: min(520px, 70%); border:1px solid var(--line); border-radius:4px; background:rgb(255 255 255 / 94%); padding:6px 9px; color:var(--muted); font-size:12px; }
    .reading-toc a { margin-right:10px; text-decoration:none; }
    .back-top { margin-left:auto; border:1px solid var(--line); border-radius:4px; background:var(--paper); color:var(--muted); padding:5px 8px; cursor:pointer; }
    .status { color: var(--muted); padding: 24px 0; }
    .error { border-left: 4px solid var(--warn); padding: 12px 16px; background: #fff4f0; color: #702a19; }
    .frontmatter { margin: 0 0 28px; border: 1px solid var(--line); border-radius: 4px; background: var(--sidebar); }
    .frontmatter summary { cursor: pointer; padding: 8px 12px; color: var(--muted); font-weight: 700; }
    .frontmatter pre { margin: 0; padding: 0 12px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .quality-panel summary { display: flex; justify-content: space-between; gap: 16px; }
    .quality-panel dl { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 5px 12px; margin: 0; padding: 0 12px 12px; }
    .quality-panel dt { color: var(--muted); }
    .quality-panel dd { margin: 0; overflow-wrap: anywhere; }
    .history-panel { margin: 0 0 28px; border: 1px solid var(--line); border-radius: 4px; background: var(--sidebar); }
    .history-panel summary { cursor: pointer; padding: 8px 12px; color: var(--muted); font-weight: 700; }
    .history-list { display: grid; gap: 6px; padding: 0 12px 12px; }
    .history-entry { border-top: 1px solid var(--line); padding-top: 7px; }
    .history-entry button { margin-left: 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); padding: 2px 7px; cursor: pointer; }
    .history-entry small { color: var(--muted); }
    .history-diff { max-height: 280px; overflow: auto; white-space: pre-wrap; font: 12px/1.45 ui-monospace, monospace; background: var(--code); padding: 8px; }
    article h1, article h2, article h3 { line-height: 1.3; margin: 1.7em 0 .65em; letter-spacing: 0; }
    article h1 { margin-top: 0; font-size: 30px; }
    .article-header { display: flex; align-items: flex-start; gap: 16px; margin: 0 0 1.25em; }
    .article-title { flex: 1 1 auto; min-width: 0; margin: 0; overflow-wrap: anywhere; }
    .export-actions { display: flex; flex: 0 0 auto; gap: 6px; }
    .favorite-button { width:36px; height:36px; border:1px solid var(--line); border-radius:4px; background:var(--paper); cursor:pointer; font-size:18px; color:var(--muted); }
    .favorite-button[aria-pressed="true"] { color:#b7791f; border-color:#d7a84b; background:#fff8e8; }
    .export-control { position: relative; }
    .export-trigger { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); cursor: pointer; }
    .export-trigger:hover, .export-trigger[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .export-trigger svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .export-menu { position: absolute; z-index: 12; top: calc(100% + 6px); right: 0; width: max-content; min-width: 190px; padding: 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); box-shadow: 0 10px 28px rgb(32 36 33 / 14%); }
    .export-menu[hidden] { display: none; }
    .export-menu button { display: block; width: 100%; border: 0; border-radius: 3px; padding: 8px 10px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
    .export-menu button:hover, .export-menu button:focus-visible { outline: 0; background: var(--accent-soft); color: var(--accent); }
    .export-menu button[aria-busy="true"] { cursor: wait; opacity: .65; }
    article h2 { padding-bottom: 7px; border-bottom: 1px solid var(--line); font-size: 22px; }
    article h3 { font-size: 18px; }
    article img, article svg { max-width: 100%; height: auto; }
    article table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
    article th, article td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
    article blockquote { margin-left: 0; padding: 4px 16px; border-left: 4px solid var(--line); color: var(--muted); }
    article :not(pre) > code { padding: 2px 5px; border-radius: 3px; background: var(--code); }
    article pre { overflow: auto; padding: 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--code); }
    article pre code { padding: 0; }
    article[aria-busy="true"] { opacity: .72; transition: opacity 120ms ease; }
    article .katex-display { max-width: 100%; overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    article.page-type-interview { line-height: 1.7; }
    article.page-type-interview > h2 { margin-top: 2em; }
    article.page-type-interview > h3 { margin-top: 1.65em; color: #31443e; }
    article.page-type-interview .interview-brief-heading { margin-bottom: 0; border-bottom: 0; }
    article.page-type-interview .interview-answer-brief { margin: 0; padding: 12px 18px; background: #edf7f4; }
    article.page-type-interview .interview-brief-heading + .interview-answer-brief { padding-top: 14px; border-top: 3px solid var(--accent); }
    article.page-type-interview .interview-warning-section { margin: 0; padding: 12px 16px; border-left: 4px solid var(--ui-warning); background: #fff8e8; }
    article.page-type-interview .interview-figure { margin: 22px auto; text-align: center; color: var(--muted); font-size: 13px; }
    article.page-type-interview li + li { margin-top: 5px; }
    .mermaid { overflow-x: auto; text-align: center; }
    .mermaid-error { border-left: 4px solid var(--ui-warning); padding: 10px 14px; background: #fff8e8; color: #6f5212; text-align: left; }
    .scrim { display: none; }
    @media (max-width: 760px) {
      .shell { display: block; }
      .toolbar { display: flex; position: sticky; top: 0; z-index: 10; background: var(--paper); }
      .sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(320px, 86vw); transform: translateX(-102%); transition: transform 160ms ease; box-shadow: 8px 0 24px rgb(0 0 0 / 12%); }
      body.nav-open .sidebar { transform: translateX(0); }
      body.nav-open .scrim { display: block; position: fixed; z-index: 20; inset: 0; border: 0; background: rgb(0 0 0 / 32%); }
      .document { width: min(100% - 32px, 920px); padding-top: 28px; }
      .interview-filters { grid-template-columns: 1fr; }
      article h1 { font-size: 26px; }
      .article-header { flex-wrap: wrap; }
      .export-actions { margin-left: auto; }
    }
  </style>

<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="知识库目录">
      <h1 class="brand"><a href="viewer.html">技术雷达知识库</a></h1>
      <div class="section-tabs" id="primarySections" role="tablist" aria-label="主要内容区">
        <button class="section-tab" id="knowledgeTab" type="button" role="tab" data-section="knowledge" aria-controls="viewerPanel" aria-selected="true" tabindex="0">知识库</button>
        <button class="section-tab" id="interviewTab" type="button" role="tab" data-section="interview" aria-controls="viewerPanel" aria-selected="false" tabindex="-1">工程面试</button>
        <button class="section-tab" id="notesTab" type="button" role="tab" data-section="notes" aria-controls="viewerPanel" aria-selected="false" tabindex="-1">论文笔记</button>
      </div>
      <div id="taxonomySummary" class="taxonomy-summary" aria-live="polite"></div>
      <div class="nav-tools">
        <div class="nav-search-row">
          <input class="nav-search" id="navigationSearch" type="search" aria-label="搜索知识页" placeholder="搜索标题、摘要或标签" autocomplete="off">
          <button class="nav-tool-button" id="collapseAll" type="button" aria-label="全部折叠" title="全部折叠"><svg data-icon="collapse" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5-5 5 5"/><path d="M7 20h10M7 4h10"/></svg></button>
          <button class="nav-tool-button" id="trashButton" type="button" aria-label="回收站" title="回收站">⌫</button>
          <button class="nav-tool-button" id="qualityIssuesButton" type="button" aria-label="质量问题" title="质量问题">!</button>
          <button class="nav-tool-button" id="duplicatesButton" type="button" aria-label="重复候选" title="重复候选">≈</button>
        </div>
        <div id="trashPanel" class="trash-panel" hidden><strong>回收站</strong><div id="trashList" class="trash-list"></div></div>
        <div id="qualityIssuesPanel" class="quality-issues-panel" hidden><strong>质量问题</strong><div id="qualityIssuesList"></div></div>
        <div id="duplicatesPanel" class="quality-issues-panel" hidden><strong>重复候选（仅人工审阅）</strong><div id="duplicatesList"></div></div>
        <div class="interview-filters" id="interviewFilters" hidden>
          <select class="nav-filter" id="roleFilter" aria-label="岗位筛选"><option value="">全部岗位</option></select>
          <select class="nav-filter" id="difficultyFilter" aria-label="难度筛选"><option value="">全部难度</option></select>
          <select class="nav-filter" id="tagFilter" aria-label="知识方向筛选"><option value="">全部方向</option></select>
        </div>
      </div>
      <nav id="navigation" aria-live="polite"><div class="nav-skeleton"><p class="status">正在读取索引...</p></div></nav>
    </aside>
    <button class="scrim" id="scrim" aria-label="关闭导航"></button>
    <main class="main" id="viewerPanel" role="tabpanel" aria-labelledby="knowledgeTab">
      <div class="toolbar">
        <button class="icon-button" id="menuButton" type="button" aria-label="打开导航" title="打开导航">☰</button>
      </div>
      <div class="document">
        <div id="message" class="status" role="status">正在载入...</div>
        <details id="qualityPanel" class="frontmatter quality-panel" hidden>
          <summary><span>页面质量</span><span id="qualitySummary"></span></summary>
          <dl id="qualityFacts"></dl>
        </details>
        <details id="historyPanel" class="history-panel" hidden>
          <summary>页面版本历史</summary>
          <div id="historyList" class="history-list"></div>
        </details>
        <details id="frontmatter" class="frontmatter" hidden>
          <summary>页面元数据</summary>
          <pre id="frontmatterText"></pre>
        </details>

    let userState = userStates.knowledge;
    function saveUserState() { userStates[activeSection] = userState; localStorage.setItem(`radar-viewer-user-state-${activeSection}-v1`, JSON.stringify(userState)); }
    async function loadTrash() { elements.trashList.replaceChildren(); try { const response = await fetch('/api/pages/trash', { cache: 'no-store' }); const payload = await response.json(); if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`); if (!payload.items?.length) { const empty = document.createElement('small'); empty.textContent = '回收站为空'; elements.trashList.append(empty); return; } payload.items.forEach((item) => { const row = document.createElement('div'); row.className = 'trash-item'; const label = document.createElement('span'); label.textContent = item.file; const restore = document.createElement('button'); restore.type = 'button'; restore.textContent = '恢复'; restore.addEventListener('click', async () => { restore.disabled = true; try { const result = await fetch('/api/pages/restore', { method: 'POST', headers: { 'Content-Type': 'application/json', Origin: location.origin }, body: JSON.stringify({ file: item.file }) }); if (!result.ok) throw new Error('恢复失败'); await loadTrash(); invalidateSectionIndexes(); await navigateTo(null, { sectionHint: activeSection, historyMode: 'replace' }); } catch (error) { restore.disabled = false; restore.title = error.message; } }); row.append(label, restore); elements.trashList.append(row); }); } catch (error) { const failure = document.createElement('small'); failure.textContent = `读取失败：${error.message}`; elements.trashList.append(failure); } }
    async function loadQualityIssues() { elements.qualityIssuesList.replaceChildren(); try { const response = await fetch('/api/quality/issues', { cache: 'no-store' }); const payload = await response.json(); if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`); const items = (payload.issues || []).map((item) => ({ file: item.file, severity: item.severity || 'error', detail: item.reason || [...(item.missing || []), ...(item.broken || []).map((link) => `断链:${link}`)].join('、') })); if (!items.length) { const empty = document.createElement('small'); empty.textContent = '未发现质量问题'; elements.qualityIssuesList.append(empty); return; } items.slice(0, 80).forEach((item) => { const link = document.createElement('a'); link.className = `quality-issue-link quality-${item.severity}`; link.href = viewerHref(item.file, activeSection); link.textContent = `[${item.severity === 'warning' ? '警告' : '错误'}] ${item.file} · ${item.detail}`; link.addEventListener('click', (event) => { event.preventDefault(); navigateTo(item.file, { sectionHint: activeSection, historyMode: 'push' }); }); elements.qualityIssuesList.append(link); }); } catch (error) { const failure = document.createElement('small'); failure.textContent = `读取失败：${error.message}`; elements.qualityIssuesList.append(failure); } }
    async function loadDuplicates() { elements.duplicatesList.replaceChildren(); try { const response = await fetch('/api/duplicates?threshold=0.86', { cache: 'no-store' }); const payload = await response.json(); if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`); if (!payload.pairs?.length) { elements.duplicatesList.append(Object.assign(document.createElement('small'), { textContent: '未发现重复候选' })); return; } payload.pairs.slice(0, 60).forEach((pair) => { const row = document.createElement('div'); row.className = 'quality-issue-link'; const label = document.createElement('span'); label.textContent = `${pair.left} ↔ ${pair.right} (${Math.round(pair.score * 100)}%)`; const preview = document.createElement('button'); preview.type = 'button'; preview.textContent = '查看差异'; preview.addEventListener('click', async () => { const data = await (await fetch(`/api/merge-preview?left=${encodeURIComponent(pair.left)}&right=${encodeURIComponent(pair.right)}`)).json(); window.alert(data.diff || '无差异'); }); row.append(label, preview); elements.duplicatesList.append(row); }); } catch (error) { elements.duplicatesList.append(Object.assign(document.createElement('small'), { textContent: `读取失败：${error.message}` })); } }
    function isFavorite(file) { return userState.favorites.includes(file); }
    function recordRecent(file, section, title) { userState.recent = [{ file, section, title, visitedAt: Date.now() }, ...userState.recent.filter(item => item.file !== file)].slice(0, 12); saveUserState(); }
    function toggleFavorite(file, button) { userState.favorites = isFavorite(file) ? userState.favorites.filter(item => item !== file) : [file, ...userState.favorites].slice(0, 100); saveUserState(); button.setAttribute('aria-pressed', String(isFavorite(file))); button.textContent = isFavorite(file) ? '★' : '☆'; }
    function saveProgress(file) { const article = elements.content; if (!file || !article || !article.scrollHeight) return; const ratio = Math.min(1, Math.max(0, (window.scrollY - article.offsetTop) / Math.max(1, article.scrollHeight - window.innerHeight))); userState.progress[file] = { scrollRatio: ratio, updatedAt: Date.now() }; saveUserState(); }
    let progressTimer = null;
    window.addEventListener('scroll', () => { clearTimeout(progressTimer); progressTimer = setTimeout(() => saveProgress(navigationState.activeFile), 180); }, { passive: true });
    elements.backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    function validatePath(value) {
      if (!value || typeof value !== 'string' || value.startsWith('/') || value.includes('\\')) return false;
      if (value.includes('?') || value.includes('#') || !value.endsWith('.md')) return false;
      const segments = value.split('/');
      if (segments.some((segment) => !segment || segment === '.' || segment === '..')) return false;
      if (segments.length === 1) return ROOT_FILES.has(value) || /^graph_[a-z]+\.md$/.test(value);
      return segments.length === 2 && ['pages', 'paper-notes'].includes(segments[0]) && segments[1].endsWith('.md');
    }

    function splitFrontmatter(source) {
      const match = source.match(/^---\s*\n([\s\S]*?)\n---\s*(?:\n|$)/);
      return match
        ? { metadata: match[1].trim(), body: source.slice(match[0].length) }
        : { metadata: '', body: source };
    }

    function parseMetadata(metadata) {
      const result = {};
      for (const line of metadata.split(/\r?\n/)) {
        const match = line.match(/^([\w\u4e00-\u9fff-]+):\s*(.*)$/);
        if (!match) continue;
        const value = match[2].trim();
        result[match[1]] = /^\[.*\]$/.test(value)
          ? value.slice(1, -1).split(',').map((item) => item.trim().replace(/^['"]|['"]$/g, '')).filter(Boolean)
          : value.replace(/^['"]|['"]$/g, '');
      }
      return result;
    }

    function metadataValues(value) {
      if (Array.isArray(value)) return value.filter(Boolean);
      return typeof value === 'string' && value.trim() ? [value.trim()] : [];
    }

    function loadCatalog() {
      if (!catalogPromise) catalogPromise = fetch('/api/catalog', { cache: 'no-store' }).then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      });
      return catalogPromise;
    }

    function objectivePageQuality(metadata, body, file, catalog = null, rawMetadata = '') {
      const summary = String(metadata.summary || metadata['摘要'] || '').trim();
      const sources = metadataValues(metadata.source || metadata['来源']);
      const sourceDeclared = sources.length > 0 || /^(?:source|来源):(?:\s*\S.*|\s*\n\s+-\s+\S+)/m.test(rawMetadata);
      const confidence = String(metadata.confidence || metadata['信度'] || '').trim();
      const tags = metadataValues(metadata.tags);
      const links = [...body.matchAll(/\[\[([^\]|\n]+)(?:\|[^\]\n]+)?\]\]/g)].map((match) => match[1].trim());
      const entry = catalog?.entries?.find((item) => item.file === file);
      const ids = new Set((catalog?.entries || []).map((item) => item.id));
      const broken = catalog ? links.filter((target) => !ids.has(target)).length : null;
      const incoming = entry ? (catalog.edges || []).filter((edge) => edge.section === entry.section && edge.target === entry.id).length : null;
      const outgoing = entry ? (catalog.edges || []).filter((edge) => edge.section === entry.section && edge.source === entry.id).length : links.length;
      const headings = (body.match(/^#{1,6}\s+\S+/gm) || []).length;
      const fencedCode = (body.match(/^```/gm) || []).length;
      const displayMath = (body.match(/\$\$/g) || []).length;
      return {
        summary: summary ? '已填写' : '未检测到', source: sourceDeclared ? '已填写' : '未检测到',
        confidence: confidence || '未检测到', tags: tags.length ? `${tags.length} 个` : '未检测到',
        links: `${outgoing} 个出站 · ${incoming == null ? '未检测' : incoming} 个入站`, broken: broken == null ? '未检测到' : `${broken} 个`,
        structure: `${headings} 个标题 · ${Math.floor(fencedCode / 2)} 个代码块 · ${Math.floor(displayMath / 2)} 个公式块`,
        complete: Boolean(summary && sourceDeclared && confidence && tags.length && broken === 0),
        health: broken == null ? '未检测到' : (!summary || !sourceDeclared || !confidence || !tags.length || broken > 0) ? 'ERROR' : incoming === 0 && outgoing === 0 ? 'WARN' : 'OK'
      };
    }

    async function renderPageQuality(metadata, body, file, rawMetadata, token, section) {
      elements.qualitySummary.textContent = '读取中';
      elements.qualityFacts.replaceChildren();
      elements.qualityPanel.hidden = false;
      let catalog = null;
      try { catalog = await loadCatalog(); } catch {}
      if (token !== enrichmentGeneration || file !== navigationState.activeFile || section !== activeSection) return;
      const quality = objectivePageQuality(metadata, body, file, catalog, rawMetadata);
      const basename = file.split('/').pop();
      const fieldsNotApplicable = section === 'notes' || (section === 'knowledge' && (file === '首页.md' || basename === '_index.md' || file === 'graph.md'));
      elements.qualitySummary.textContent = fieldsNotApplicable ? '导航页 · 不适用知识页字段' : quality.complete ? '基础字段完整' : '存在缺失字段';
      elements.qualityFacts.replaceChildren();
      const facts = fieldsNotApplicable ? [['页面类型', '导航页'], ['字段检查', '不适用'], ['断链', quality.broken], ['健康状态', quality.broken === '0 个' ? 'OK' : quality.health], ['结构', quality.structure]] : [['摘要', quality.summary], ['来源', quality.source], ['信度', quality.confidence], ['标签', quality.tags], ['引用', quality.links], ['断链', quality.broken], ['健康状态', quality.health], ['结构', quality.structure]];
      for (const [label, value] of facts) {
        const term = document.createElement('dt'); const detail = document.createElement('dd');
        term.textContent = label; detail.textContent = value; elements.qualityFacts.append(term, detail);
      }
      elements.qualityPanel.hidden = false;
    }

    function sectionForFile(file, metadata = {}) {
      if (file.startsWith('paper-notes/')) return 'notes';
      if (metadata.page_type === 'interview' || metadata.pageType === 'interview') return 'interview';
      if (Object.keys(metadata).length) return 'knowledge';
      const requested = new URLSearchParams(location.search).get('section');
      if (requested === 'knowledge' || requested === 'interview' || requested === 'notes') return requested;
      return 'knowledge';
    }

    function viewerHref(name, section = activeSection) {
      const target = name.endsWith('.md') ? name : `pages/${name}.md`;
      return `viewer.html?section=${section}&f=${encodeURIComponent(target)}`;
    }

    function canonicalViewerUrl(file, section) {
      return `viewer.html?section=${section}&f=${encodeURIComponent(file)}`;
    }

    function rewriteWikilinks(markdown) {
      return markdown.replace(/\[\[([^\]|\n]+)(?:\|([^\]\n]+))?\]\]/g, (_all, target, alias) => {
        const cleanTarget = target.trim();
        const label = (alias || target).trim().replace(/([\[\]])/g, '\\$1');
        return `[${label}](${viewerHref(cleanTarget)})`;
      });
    }

    function extractMathRegions(markdown) {
      const regions = [];
      let output = '';
      let index = 0;
      const store = (source) => {
        const token = `MATHREGION_${regions.length}_END`;
        regions.push({ token, source });
        output += token;
      };
      const closingAt = (delimiter, from) => {
        let found = markdown.indexOf(delimiter, from);
        while (found >= 0 && markdown[found - 1] === '\\') found = markdown.indexOf(delimiter, found + delimiter.length);
        return found;
      };
      while (index < markdown.length) {
        const lineStart = index === 0 || markdown[index - 1] === '\n';
        const fence = lineStart && (markdown.startsWith('```', index) || markdown.startsWith('~~~', index))
          ? markdown.slice(index, index + 3) : null;
        if (fence) {
          const close = markdown.indexOf(`\n${fence}`, index + 3);
          const end = close < 0 ? markdown.length : (markdown.indexOf('\n', close + 1) + 1 || markdown.length);
          output += markdown.slice(index, end);
          index = end;
          continue;
        }
        if (markdown[index] === '`') {
          let run = 1;
          while (markdown[index + run] === '`') run += 1;
          const delimiter = '`'.repeat(run);
          const close = markdown.indexOf(delimiter, index + run);
          const end = close < 0 ? index + run : close + run;
          output += markdown.slice(index, end);
          index = end;
          continue;
        }
        const delimiters = markdown.startsWith('$$', index) ? ['$$', '$$']
          : markdown.startsWith('\\[', index) ? ['\\[', '\\]']
          : markdown.startsWith('\\(', index) ? ['\\(', '\\)']
          : markdown[index] === '$' && markdown[index - 1] !== '\\' ? ['$', '$'] : null;
        if (delimiters) {
          const close = closingAt(delimiters[1], index + delimiters[0].length);
          if (close >= 0) {
            const end = close + delimiters[1].length;
            store(markdown.slice(index, end));
            index = end;
            continue;
          }
        }
        output += markdown[index];
        index += 1;
      }
      return { markdown: output, regions };
    }

    function restoreMathRegions(root, regions) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        let value = node.nodeValue;
        for (const region of regions) value = value.replaceAll(region.token, () => region.source);
        node.nodeValue = value;
      }
    }

    function parseIndex(markdown) {
      const groups = [];
      let current = null;
      const entries = new Map();
      for (const line of markdown.split(/\r?\n/)) {
        const heading = line.match(/^##\s+(.+?)\s*$/);
        if (heading) {
          current = { name: heading[1], pages: [] };
          groups.push(current);
          continue;
        }
        const item = line.match(/^-\s+\[\[([^\]|]+)(?:\|([^\]]+))?\]\](?:\s+`([^`]*)`)?(?:\s+—\s+(.*))?$/);
        if (!current || !item) continue;
        const title = item[1].trim();
        const file = `pages/${title}.md`;
        const tags = (item[3] || '').match(/#[^\s#]+/g)?.map((tag) => tag.slice(1)) || [];
        const aliases = item[2] ? [item[2].trim()] : [];
        const entry = entries.get(file) || { title, file, summary: '', tags: [], aliases: [], categories: [] };
        if (item[4]) entry.summary = item[4].trim();
        entry.tags = [...new Set([...entry.tags, ...tags])];
        entry.aliases = [...new Set([...entry.aliases, ...aliases])];
        if (!entry.categories.includes(current.name)) entry.categories.push(current.name);
        entry.searchText = normalizeSearch([entry.title, entry.summary, ...entry.tags, ...entry.aliases].join(' '));
        entries.set(file, entry);
        current.pages.push(entry);
      }
      return { groups: groups.filter((group) => group.pages.length), entries: [...entries.values()] };
    }

    function parseInterviewIndex(markdown) {
      const groups = [];
      const entries = new Map();
      let current = null;
      for (const line of markdown.split(/\r?\n/)) {
        const heading = line.match(/^##\s+(.+?)\s*$/);
        if (heading) {
          current = { name: heading[1].replace(/^\u89d2\u8272:\s*/, ''), pages: [] };
          if (heading[1].startsWith('\u89d2\u8272:')) groups.push(current);
          else current = null;
          continue;
        }
        const item = line.match(/^-\s+\[\[([^\]|]+)(?:\|([^\]]+))?\]\]\s*`([^`]*)`\s+—\s+原问题:\s*(.*?)\s+·\s+摘要:\s*(.*?)\s+·\s+角色:\s*(.*?)\s+·\s+难度:\s*(.*?)\s*$/);
        if (!current || !item) continue;
        const title = item[1].trim();
        const file = `pages/${title}.md`;
        const tags = item[3].match(/#[^\s#]+/g)?.map((tag) => tag.slice(1)) || [];
        const roles = item[6].split(',').map((role) => role.trim()).filter(Boolean);
        let entry = entries.get(file);
        if (!entry) entry = { title, file, question: item[4].trim(), summary: item[5].trim(), tags, roles, difficulty: item[7].trim(), aliases: item[2] ? [item[2].trim()] : [], categories: [] };
        entry.roles = [...new Set([...entry.roles, ...roles])];
        if (!entry.categories.includes(current.name)) entry.categories.push(current.name);
        entry.searchText = normalizeSearch([entry.title, entry.question, entry.summary, ...entry.tags, ...entry.roles, entry.difficulty].join(' '));
        entries.set(file, entry);
        current.pages.push(entry);
      }
      return { groups, entries: [...entries.values()] };
    }

    function setMessage(text, isError = false) {
      elements.message.textContent = text;
      elements.message.hidden = !text;
      elements.message.className = isError ? 'error' : 'status';
      elements.message.setAttribute('role', isError ? 'alert' : 'status');

    function renderReadingTools() {

      elements.readingTools.hidden = headings.length === 0;

    function notifyRefreshResult(ok, error = '') {

      window.parent.postMessage({ type: 'kb-operation-result', version: 1, operation: 'knowledge-refresh', ok, partial: false, surface: 'viewer', revision: sessionStorage.getItem('kb-revision') || null, stats: null, preserved: ok ? [] : ['当前页面'], error: error || null }, WORKBENCH_ORIGIN);
    }

    function notifyActiveFile(file, title, metadata = {}) {
      if (window.parent === window) return;
      const pageType = metadata.page_type || metadata.pageType;
      const context = pageType === 'interview'
        ? { kind: 'page', pageType: 'interview', file, title, question: metadata.question || metadata.original_question || metadata['原问题'] || '', roles: Array.isArray(metadata.roles) ? metadata.roles : [], difficulty: metadata.difficulty || '' }
        : { kind: 'page', file, title: title || file.split('/').pop().replace(/\.md$/, '') };
      window.parent.postMessage({
        type: 'kb-context',
        version: 1,
        context: { ...context, version: 1, surface: 'viewer', pageType: pageType === 'interview' ? 'interview' : 'knowledge' }
      }, WORKBENCH_ORIGIN);
    }

    function normalizeSearch(value) {
      return String(value || '').normalize('NFKC').toLocaleLowerCase('zh-CN').trim();
    }

    function restoreNavigationState() {
      try {
        const stored = sessionStorage.getItem(SECTIONS[activeSection].navigationKey)
          || (activeSection === 'knowledge' ? sessionStorage.getItem(NAVIGATION_STATE_KEY) : null);
        const parsed = JSON.parse(stored || '{}');
        if (Array.isArray(parsed.expanded)) navigationState.expanded = new Set(parsed.expanded.filter((item) => typeof item === 'string'));
        navigationState.search = typeof parsed.search === 'string' ? parsed.search : '';
        navigationState.filters = { ...navigationState.filters, ...(parsed.filters || {}) };
        navigationState.activeFile = sessionStorage.getItem(SECTIONS[activeSection].activeFileKey) || navigationState.activeFile;
      } catch (_error) {
        navigationState.expanded = new Set();
      }
    }

    function saveNavigationState() {
      sessionStorage.setItem(SECTIONS[activeSection].navigationKey, JSON.stringify({ expanded: [...navigationState.expanded], search: navigationState.search, filters: navigationState.filters }));
      if (navigationState.activeFile) sessionStorage.setItem(SECTIONS[activeSection].activeFileKey, navigationState.activeFile);

    function filterNavigation(query) {

    async function loadSectionIndex(section, { force = false } = {}) {

        const payload = await response.json(); elements.historyList.replaceChildren();
        if (!payload.commits?.length) { const empty = document.createElement('p'); empty.className = 'status'; empty.textContent = '暂无 Git 版本记录'; elements.historyList.append(empty); return; }
        payload.commits.forEach((commit, index) => { const entry = document.createElement('div'); entry.className = 'history-entry'; const text = document.createElement('span'); text.textContent = `${commit.date} · ${commit.subject} · ${commit.id.slice(0, 8)}`; entry.append(text); if (index < payload.commits.length - 1) { const diff = document.createElement('button'); diff.type = 'button'; diff.textContent = '查看与上一版差异'; diff.addEventListener('click', async () => { const result = await fetch(`/api/page-history?file=${encodeURIComponent(snapshot.file)}&old=${encodeURIComponent(payload.commits[index + 1].id)}&new=${encodeURIComponent(commit.id)}`).then((item) => item.json()); const pre = document.createElement('pre'); pre.className = 'history-diff'; pre.textContent = result.diff || '无差异'; entry.append(pre); diff.disabled = true; }); entry.append(diff); } elements.historyList.append(entry); });
      } catch (error) { elements.historyList.replaceChildren(); const failure = document.createElement('p'); failure.className = 'error'; failure.textContent = `版本历史读取失败：${error.message}`; elements.historyList.append(failure); }
    }

    function cloneExportArticle() {
      const clone = elements.content.cloneNode(true);
      clone.removeAttribute('id');
      clone.removeAttribute('aria-busy');
      clone.querySelectorAll('[data-export-ui]').forEach((node) => node.remove());
      const article = document.createElement('article');
      article.className = elements.content.className;
      article.innerHTML = DOMPurify.sanitize(clone.innerHTML, {
        USE_PROFILES: { html: true, svg: true, svgFilters: true },
        FORBID_TAGS: ['script'],
        FORBID_ATTR: ['style'],
      });
      return article;
    }

    function setExportFeedback(message, isError = false) {
      const generation = ++exportFeedbackGeneration;
      setMessage(message, isError);
      if (isError) return;
      window.setTimeout(() => {
        if (generation === exportFeedbackGeneration && elements.content.getAttribute('aria-busy') !== 'true') setMessage('');
      }, 2600);
    }

    async function copyRichText() {
      const article = cloneExportArticle();
      const html = article.outerHTML;
      const plain = article.textContent.trim();
      if (typeof ClipboardItem !== 'function' || typeof navigator.clipboard?.write !== 'function') {
        await navigator.clipboard.writeText(plain);
        setExportFeedback('Plain text copied because rich-text clipboard is unavailable.');
        return;
      }
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([plain], { type: 'text/plain' }),
      })]);
      setExportFeedback('Rich text copied.');
    }

    function normalizeExportFilename(name) {
      const value = String(name || '')
        .replace(/[\/\\:*?"<>|\x00-\x1f\x7f]/g, '_')
        .trim()
        .replace(/[. ]+$/g, '');
      return value || 'knowledge-page';
    }

    function triggerBlobDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.hidden = true;
      document.body.append(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    function downloadMarkdown(snapshot) {
      const sourceName = snapshot.file.split('/').pop() || `${snapshot.title}.md`;
      const filename = `${normalizeExportFilename(sourceName.replace(/\.md$/i, ''))}.md`;
      triggerBlobDownload(new Blob([snapshot.source], { type: 'text/markdown;charset=utf-8' }), filename);
      setExportFeedback('Markdown downloaded.');
    }

    async function fetchRequiredBlob(url, label) {
      let response;
      try {
        response = await fetch(url);
      } catch (error) {
        throw new Error(`${label}: ${error?.message || 'network failure'}`);
      }
      if (!response.ok) throw new Error(`${label}: HTTP ${response.status}`);
      return response.blob();
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener('load', () => resolve(reader.result), { once: true });
        reader.addEventListener('error', () => reject(new Error('Unable to encode required asset.')), { once: true });
        reader.readAsDataURL(blob);
      });
    }

    function safeResolvedLink(rawUrl, baseUrl) {
      if (!rawUrl || rawUrl.startsWith('#')) return rawUrl;
      const resolved = new URL(rawUrl, baseUrl);
      return ['http:', 'https:', 'mailto:'].includes(resolved.protocol) ? resolved.href : '';
    }

    async function embedArticleAssets(article, snapshot) {
      for (const image of article.querySelectorAll('img[src]')) {
        const rawUrl = image.getAttribute('src');
        const resolved = new URL(rawUrl, snapshot.baseUrl);
        if (!['http:', 'https:'].includes(resolved.protocol)) throw new Error(`Unsafe image URL: ${rawUrl}`);
        const blob = await fetchRequiredBlob(resolved.href, rawUrl);
        image.setAttribute('src', await blobToDataUrl(blob));
        image.removeAttribute('srcset');
      }
      for (const link of article.querySelectorAll('a[href]')) {
        const safe = safeResolvedLink(link.getAttribute('href'), snapshot.baseUrl);
        if (safe) link.setAttribute('href', safe);
        else link.removeAttribute('href');
      }
    }

    async function inlineKatexCss() {
      const cssUrl = new URL('vendor/katex/katex.min.css', document.baseURI);
      const cssBlob = await fetchRequiredBlob(cssUrl.href, 'vendor/katex/katex.min.css');
      let css = await cssBlob.text();
      const sheet = new CSSStyleSheet();
      sheet.replaceSync(css);
      for (const rule of sheet.cssRules) {
        if (rule.type !== CSSRule.FONT_FACE_RULE) continue;
        const woff2Sources = rule.style.getPropertyValue('src')
          .split(',')
          .map((source) => source.trim())
          .filter((source) => /\.woff2(?:[)'"\s]|$)/i.test(source));
        if (!woff2Sources.length) throw new Error(`KaTeX font-face has no local WOFF2 source: ${rule.style.getPropertyValue('font-family')}`);
        rule.style.setProperty('src', woff2Sources.join(', '));
      }
      css = [...sheet.cssRules].map((rule) => rule.cssText).join('\n');
      const references = [...css.matchAll(/url\((['"]?)([^)'"\s]+)\1\)/g)];
      const replacements = new Map();
      for (const reference of references) {
        const rawUrl = reference[2];
        if (rawUrl.startsWith('data:') || replacements.has(rawUrl)) continue;
        const fontUrl = new URL(rawUrl, cssUrl);
        const fontBlob = await fetchRequiredBlob(fontUrl.href, rawUrl);
        replacements.set(rawUrl, await blobToDataUrl(fontBlob));
      }
      for (const [rawUrl, dataUrl] of replacements) css = css.split(rawUrl).join(dataUrl);
      return css;
    }

    const EXPORTED_ARTICLE_CSS = `
      :root{color-scheme:light;--ink:#202421;--muted:#66706a;--line:#d8ded9;--accent:#087f68;--code:#f5f7f8}
      *{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink)}
      body{font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}
      article{width:min(920px,calc(100% - 48px));margin:0 auto;padding:48px 0 80px}
      .article-header{display:block;margin:0 0 1.25em}.article-title{margin:0;overflow-wrap:anywhere}
      h1,h2,h3{line-height:1.3;margin:1.7em 0 .65em;letter-spacing:0}h1{margin-top:0;font-size:30px}
      h2{padding-bottom:7px;border-bottom:1px solid var(--line);font-size:22px}h3{font-size:18px}
      a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}img,svg{max-width:100%;height:auto}
      table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}th,td{border:1px solid var(--line);padding:7px 10px;text-align:left}
      blockquote{margin-left:0;padding:4px 16px;border-left:4px solid var(--line);color:var(--muted)}
      :not(pre)>code{padding:2px 5px;border-radius:3px;background:var(--code)}pre{overflow:auto;padding:14px;border:1px solid var(--line);border-radius:4px;background:var(--code)}pre code{padding:0}
      .katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:4px 0}.mermaid{overflow-x:auto;text-align:center}
      .page-type-interview{line-height:1.7}.page-type-interview>h2{margin-top:2em}.interview-answer-brief{padding:12px 18px;background:#edf7f4}.interview-warning-section{padding:12px 16px;border-left:4px solid #9a6700;background:#fff8e8}
      @media(max-width:760px){article{width:min(100% - 32px,920px);padding-top:28px}h1{font-size:26px}}
    `;

    function escapeHtmlText(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[character]);
    }

    async function buildSelfContainedHtml(snapshot) {
      const article = cloneExportArticle();
      await embedArticleAssets(article, snapshot);
      const katexCss = article.querySelector('.katex') ? await inlineKatexCss() : '';
      const serializedArticle = DOMPurify.sanitize(article.outerHTML, {
        USE_PROFILES: { html: true, svg: true, svgFilters: true },
        FORBID_TAGS: ['script'],
        FORBID_ATTR: ['onerror', 'onload', 'onclick'],
      });
      const title = escapeHtmlText(snapshot.title);
      return `<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<style>${katexCss}\n${EXPORTED_ARTICLE_CSS}</style>
</head>
<body>
${serializedArticle}
<!-- No JavaScript is required to read this export. -->
</body>
</html>`;
    }

    async function downloadSelfContainedHtml(snapshot) {
      const html = await buildSelfContainedHtml(snapshot);
      triggerBlobDownload(
        new Blob([html], { type: 'text/html;charset=utf-8' }),
        `${normalizeExportFilename(snapshot.title)}.html`,
      );
      setExportFeedback('HTML downloaded.');
    }

    async function runDownloadCommand(command, snapshot) {
      if (command === 'download-markdown') {
        downloadMarkdown(snapshot);
        return;
      }
      if (command === 'download-html') {
        await downloadSelfContainedHtml(snapshot);
        return;
      }
      throw new Error(`Unknown download command: ${command}`);
    }

    async function handleExportCommand(event) {
      const button = event.target.closest('[data-export-command]');
      if (!button || button.getAttribute('aria-busy') === 'true') return;
      const snapshot = activeExportSnapshot;
      if (!snapshot || snapshot.token !== navigationGeneration) return;
      button.setAttribute('aria-busy', 'true');
      try {
        if (button.dataset.exportCommand === 'copy-source') {
          await navigator.clipboard.writeText(snapshot.source);
          setExportFeedback('Original Markdown copied.');
        } else if (button.dataset.exportCommand === 'copy-body') {
          await navigator.clipboard.writeText(snapshot.body);
          setExportFeedback('Body-only Markdown copied.');
        } else if (button.dataset.exportCommand === 'copy-rich') {
          await copyRichText();
        } else {
          await runDownloadCommand(button.dataset.exportCommand, snapshot);
        }
        closeExportMenus();
      } catch (error) {
        setExportFeedback(`Export failed: ${error?.message || 'Unknown error'}`, true);
      } finally {
        button.removeAttribute('aria-busy');
      }
    }

    async function renderPageData(file, section, page, token) {
        const { metadata, body, pageMetadata } = page;
        elements.frontmatter.hidden = !metadata;
        elements.frontmatterText.textContent = metadata;
        const math = extractMathRegions(rewriteWikilinks(body));
        const rendered = marked.parse(math.markdown, { gfm: true, breaks: false });
        elements.content.innerHTML = DOMPurify.sanitize(rendered, { USE_PROFILES: { html: true } });
        decorateInterviewBody(elements.content, pageMetadata);
        if (math.regions.length) {
          restoreMathRegions(elements.content, math.regions);
          renderMathInElement(elements.content, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false },
              { left: '\\[', right: '\\]', display: true }
            ],
            throwOnError: false,
            trust: false,
            strict: 'warn'
          });
        }
        const codeBlocks = elements.content.querySelectorAll('pre code:not(.language-mermaid)');
        codeBlocks.forEach((block) => hljs.highlightElement(block));
        const mermaidBlocks = elements.content.querySelectorAll('pre code.language-mermaid');
        if (mermaidBlocks.length) {
          mermaidBlocks.forEach((block) => {
            const container = document.createElement('div');
            container.className = 'mermaid';
            container.textContent = block.textContent;
            block.parentElement.replaceWith(container);
          });
          await renderMermaidDiagrams(elements.content);
        }
        if (token !== navigationGeneration) return;
        const pageTitle = elements.content.querySelector('h1')?.textContent?.trim() || file.split('/').pop().replace(/\.md$/, '');
        renderReadingTools();
        const baseUrl = new URL(file, document.baseURI).href;
        const snapshot = Object.freeze({
          token,
          file,
          section,
          title: pageTitle,
          source: page.source,
          body: page.body,
          baseUrl,
        });
        if (token !== navigationGeneration) return;
        document.title = `${pageTitle} · 技术雷达`;
        activeExportSnapshot = snapshot;
        mountExportActions(snapshot);
        setMessage('');
        updateActiveNavigation(file);
        recordRecent(file, section, pageTitle);
        notifyActiveFile(file, pageTitle, pageMetadata);
        const saved = userState.progress[file];
        if (saved && saved.scrollRatio > 0.02) window.requestAnimationFrame(() => window.scrollTo({ top: Math.max(0, elements.content.offsetTop + saved.scrollRatio * Math.max(0, elements.content.scrollHeight - window.innerHeight)), behavior: 'auto' }));
    }

    function commitSection(section, parsed, file) {
      activeSection = section;
      userState = userStates[section] || (userStates[section] = stateDefaults());
      navigationState = navigationStates[section];
      navigationState.groups = parsed.groups;
      navigationState.entries = parsed.entries;
      restoreNavigationState();
      navigationState.activeFile = file;
      updateSectionTabs(section);
      elements.navigationSearch.value = navigationState.search;
      configureInterviewFilters();
      filterNavigation(navigationState.search);
    }

    function setNavigationBusy(busy, title = '') {
      elements.content.setAttribute('aria-busy', String(busy));
      if (busy) setMessage(`正在打开${title ? `「${title}」` : '页面'}`);
      else if (!elements.message.classList.contains('error')) setMessage('');
    }

    async function navigateTo(requestedFile = null, { sectionHint = activeSection, historyMode = 'replace' } = {}) {
      const token = ++navigationGeneration;
      closeExportMenus();
      const hintedSection = SECTIONS[sectionHint] ? sectionHint : 'knowledge';
      if (requestedFile && !validatePath(requestedFile)) {
        if (token !== navigationGeneration) return;
        restoreExportSnapshotOwnership();
        setMessage('已拒绝：文件路径不在知识库允许范围内。', true);
        return;
      }
      const requestedTitle = navigationStates[hintedSection].entries
        .find((entry) => entry.file === requestedFile)?.title || '';
      setNavigationBusy(true, requestedTitle);
      navigationState.search = elements.navigationSearch.value;
      saveNavigationState();
      try {
        let parsed = await loadSectionIndex(hintedSection);
        if (token !== navigationGeneration) return;
        const persistedFile = sessionStorage.getItem(SECTIONS[hintedSection].activeFileKey);
        const file = requestedFile || persistedFile || parsed.entries[0]?.file || null;
        if (!file) {
          if (token !== navigationGeneration) return;
          commitSection(hintedSection, parsed, null);
          const url = `viewer.html?section=${hintedSection}`;
          if (historyMode === 'push') history.pushState({ file: null, section: hintedSection }, '', url);
          else if (historyMode === 'replace') history.replaceState({ file: null, section: hintedSection }, '', url);
          activeExportSnapshot = null;
          elements.content.replaceChildren();
          elements.frontmatter.hidden = true;
          setNavigationBusy(false);
          setMessage('当前专区暂无页面。');
          return;
        }
        const page = await fetchPageData(file);
        if (token !== navigationGeneration) return;
        const detectedSection = sectionForFile(file, page.pageMetadata) || hintedSection;
        if (detectedSection !== hintedSection) {
          parsed = await loadSectionIndex(detectedSection);
          if (token !== navigationGeneration) return;
        }
        if (token !== navigationGeneration) return;
        commitSection(detectedSection, parsed, file);
        const canonicalUrl = canonicalViewerUrl(file, detectedSection);
        if (historyMode === 'push') history.pushState({ file, section: detectedSection }, '', canonicalUrl);
        else if (historyMode === 'replace') history.replaceState({ file, section: detectedSection }, '', canonicalViewerUrl(file, detectedSection));
        await renderPageData(file, detectedSection, page, token);
        if (token !== navigationGeneration) return;
        setNavigationBusy(false);
        const enrichmentToken = ++enrichmentGeneration;
        void renderPageQuality(
          page.pageMetadata, page.body, file, page.metadata, enrichmentToken, detectedSection
        );
        void refreshTaxonomySummary(detectedSection, enrichmentToken, file);
        return true;
      } catch (error) {
        if (token !== navigationGeneration) return;
        restoreExportSnapshotOwnership();
        elements.navigation.replaceChildren();
        const message = document.createElement('p');
        message.className = 'error';
        message.textContent = `载入失败：${error.message}`;
        const retry = document.createElement('button');
        retry.className = 'nav-retry';
        retry.type = 'button';
        retry.textContent = '重试';
        const failedIntent = { requestedFile, sectionHint: hintedSection, historyMode };
        retry.addEventListener('click', () => navigateTo(failedIntent.requestedFile, failedIntent));
        elements.navigation.append(message, retry);
        setMessage(`未能打开目标页，当前内容已保留：${error.message}`, true);
        elements.content.setAttribute('aria-busy', 'false');
        return false;
      }
    }

    async function refreshActiveSurface(section = activeSection) {
      navigationGeneration += 1;
      invalidateSectionIndexes();
      catalogPromise = null;
      try {
        await loadSectionIndex(section, { force: true });
      } catch (error) {
        restoreExportSnapshotOwnership();
        elements.content.setAttribute('aria-busy', 'false');
        setMessage(`刷新后索引读取失败，当前内容已保留：${error.message}`, true);
        return false;
      }
      return navigateTo(navigationStates[section].activeFile, {
        sectionHint: section,
        historyMode: 'replace',
      });
    }

    function retryIndexLoad(section = activeSection) {
      return navigateTo(navigationStates[section].activeFile, { sectionHint: section, historyMode: 'replace' });
    }

    function switchSection(section) {
      return navigateTo(null, { sectionHint: section, historyMode: 'push' });
    }

    function renderMarkdown(file, expectedSection = activeSection, historyMode = 'replace') {
      return navigateTo(file, { sectionHint: expectedSection, historyMode });
    }

    function closeNavigation() { document.body.classList.remove('nav-open'); }
    window.addEventListener('message', (event) => {
      if (event.origin !== WORKBENCH_ORIGIN || event.source !== window.parent) return;
      if (event.data?.type === 'kb-open-navigation') document.body.classList.add('nav-open');
      if (event.data?.type === 'kb-refresh') {
        refreshActiveSurface(activeSection)
          .then((ok) => notifyRefreshResult(ok, ok ? '' : '当前页面恢复失败'));
      }
      if (event.data?.type === 'kb-navigate' && validatePath(event.data.file) && SECTIONS[event.data.section]) navigateTo(event.data.file, { sectionHint: event.data.section, historyMode: 'push' });
    });
    document.querySelector('.section-tabs').addEventListener('click', (event) => {
      const tab = event.target.closest('[role="tab"][data-section]');
      if (tab && tab.dataset.section !== activeSection) switchSection(tab.dataset.section);
    });
    function handleSectionTabKeydown(event) {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      const tabs = [...document.querySelectorAll('[role="tab"][data-section]')];
      const current = tabs.indexOf(event.target);
      if (current < 0) return;
      event.preventDefault();
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1
        : (current + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      tabs[next].focus();
      if (tabs[next].dataset.section !== activeSection) switchSection(tabs[next].dataset.section);
    }
    document.querySelector('#primarySections').addEventListener('keydown', handleSectionTabKeydown);
    document.querySelector('#menuButton').addEventListener('click', () => document.body.classList.toggle('nav-open'));
    document.querySelector('#scrim').addEventListener('click', closeNavigation);
    elements.navigationSearch.addEventListener('input', () => filterNavigation(elements.navigationSearch.value));
    [elements.roleFilter, elements.difficultyFilter, elements.tagFilter].forEach((select) => select.addEventListener('change', () => filterNavigation(elements.navigationSearch.value)));
    elements.collapseAll.addEventListener('click', () => {
      navigationState.expanded.clear();
      saveNavigationState();
      elements.navigationSearch.value = '';
      renderCategorizedNavigation();
    });
    elements.trashButton.addEventListener('click', () => { const open = elements.trashPanel.hidden; elements.trashPanel.hidden = !open; if (open) loadTrash(); });
    elements.qualityIssuesButton.addEventListener('click', () => { const open = elements.qualityIssuesPanel.hidden; elements.qualityIssuesPanel.hidden = !open; if (open) loadQualityIssues(); });
    elements.duplicatesButton.addEventListener('click', () => { const open = elements.duplicatesPanel.hidden; elements.duplicatesPanel.hidden = !open; if (open) loadDuplicates(); });
    document.addEventListener('click', (event) => {
      const link = event.target.closest('a[href^="viewer.html?"]');
      if (!link) return;
      const file = link.dataset.file || new URL(link.href).searchParams.get('f');
      if (!validatePath(file)) return;
      event.preventDefault();
      const section = link.dataset.section || new URL(link.href).searchParams.get('section') || activeSection;
      navigateTo(file, { sectionHint: section, historyMode: 'push' });
      closeNavigation();
    });
    document.addEventListener('pointerdown', (event) => {
      if (openExportMenu && !event.target.closest('.export-control')) closeExportMenus();
    });
    window.addEventListener('popstate', () => {
      const params = new URLSearchParams(location.search);
      const requestedSection = params.get('section');
      const section = SECTIONS[requestedSection] ? requestedSection : 'knowledge';
      const file = params.get('f');
      navigateTo(file, { sectionHint: section, historyMode: 'none' });
    });
    document.addEventListener('keydown', (event) => {
      const editable = event.target.matches('input,textarea,[contenteditable="true"]');
      if (event.key === '/' && !editable) {
        event.preventDefault();
        elements.navigationSearch.focus();
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        elements.navigationSearch.focus();
      }
      if (event.key === 'Escape') {
        if (elements.navigationSearch.value) {
          elements.navigationSearch.value = '';
          filterNavigation('');
        } else closeNavigation();
      }
    });

    function requireRuntime(name, value) {
      if (!value) throw new Error(`${name} 本地资源加载失败，请重新运行 scripts/vendor_web_assets.sh`);
      return value;
    }

    try {
      requireRuntime('Marked', window.marked);
      requireRuntime('DOMPurify', window.DOMPurify);
      requireRuntime('Highlight.js', window.hljs);
      requireRuntime('Mermaid', window.mermaid);
      requireRuntime('KaTeX', window.katex);
      requireRuntime('KaTeX auto-render', window.renderMathInElement);
      marked.setOptions({ mangle: false, headerIds: false });
      mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'neutral' });
      const params = new URLSearchParams(location.search);
      const requestedSection = params.get('section');
      const requestedFile = params.get('f') || (requestedSection === 'interview' || requestedSection === 'notes' ? null : DEFAULT_FILE);
      navigateTo(requestedFile, { sectionHint: requestedSection || 'knowledge', historyMode: 'replace' });
    } catch (error) {
      setMessage(error.message, true);
    }
  </script>
</body>
</html>
