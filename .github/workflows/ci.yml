name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-taxonomy.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-taxonomy.txt
      - name: Rebuild date-sensitive generated artifacts
        run: |
          python scripts/build_index.py
          python scripts/render_graph.py
      - name: Run Python test suite
        run: |
          : > python-tests.log
          groups=(
            "tests.test_serve_kb tests.test_v3_scripts tests.test_web_console_manual"
            "tests.test_taxonomy_candidates tests.test_taxonomy_cluster tests.test_taxonomy_config tests.test_taxonomy_embeddings tests.test_taxonomy_engine tests.test_taxonomy_end_to_end tests.test_taxonomy_models tests.test_taxonomy_naming tests.test_taxonomy_signals"
            "tests.test_viewer_contract tests.test_graph_view_contract tests.test_home_web_first tests.test_interview_graph tests.test_interview_health tests.test_interview_index tests.test_interview_page_types tests.test_interview_taxonomy tests.test_vendor_assets"
            "tests.test_community_graph tests.test_idea_lab tests.test_local_backup tests.test_create_knowledge_page_skill tests.test_create_engineering_interview_page_skill tests.test_paper_reading_skill tests.test_web_workbench_e2e"
          )
          for group in "${groups[@]}"; do
            echo "=== $group ===" | tee -a python-tests.log
            python -m unittest $group -v 2>&1 | tee -a python-tests.log || echo PYTHON_TEST_FAILURE=1 >> "$GITHUB_ENV"
          done
          test "${PYTHON_TEST_FAILURE:-0}" = 0
      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-${{ matrix.python-version }}
          path: python-tests.log

  javascript-contract:
    name: Node ${{ matrix.node-version }} contract checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Check JavaScript sources
        run: node scripts/ci_node_checks.mjs

  artifact-health:
    name: Generated artifact and health checks
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install taxonomy dependencies
        run: python -m pip install -r requirements-taxonomy.txt
      - name: Rebuild and validate artifacts
        run: |
          python scripts/build_index.py
          python scripts/render_graph.py
          python scripts/check_health.py
          python scripts/taxonomy_cli.py validate
