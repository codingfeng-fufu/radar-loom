name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-taxonomy.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-taxonomy.txt
      - name: Rebuild date-sensitive generated artifacts
        run: |
          python scripts/build_index.py
          python scripts/render_graph.py
      - name: Run Python test suite
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee python-tests.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-${{ matrix.python-version }}
          path: python-tests.log

  javascript-contract:
    name: Node ${{ matrix.node-version }} contract checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Check JavaScript sources
        run: node scripts/ci_node_checks.mjs

  artifact-health:
    name: Generated artifact and health checks
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install taxonomy dependencies
        run: python -m pip install -r requirements-taxonomy.txt
      - name: Rebuild and validate artifacts
        run: |
          python scripts/build_index.py
          python scripts/render_graph.py
          python scripts/check_health.py
          python scripts/taxonomy_cli.py validate
